<title>Bock – Bestellsystem</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap');
:root{
  --bg:#f9f9f9;--card:#fff;--cream:#f4f4f4;
  --black:#0a0a0a;--dark:#1a1a1a;--mid:#555;--light:#888;--xlight:#bbb;
  --border:#e0e0e0;--border-dark:#333;
  --accent:#0a0a0a;--accent-lt:#f0f0f0;
  --green:#1a7a3a;--green-lt:#e8f5ed;
  --red:#c0392b;--red-lt:#fdecea;
  --amber:#b8860b;--amber-lt:#fef8e1;
  --blue:#1a4a7a;--blue-lt:#e8f0fb;
  --shadow:0 1px 4px rgba(0,0,0,.08);--shadow-md:0 4px 16px rgba(0,0,0,.10);
  --r:10px;--rsm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#0a0a0a;padding:20px}
.lcard{background:white;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;text-align:center}
.lcard img{height:44px;object-fit:contain;margin-bottom:4px;filter:invert(0)}
.ltag{font-size:10px;color:var(--xlight);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.ldesc{font-size:11px;color:var(--xlight);margin-bottom:28px;font-style:italic}
.lcard select,.lcard input[type=password]{width:100%;padding:12px 14px;border:1.5px solid var(--border);
  border-radius:var(--rsm);font-family:'Inter',sans-serif;font-size:14px;color:var(--dark);
  background:var(--bg);margin-bottom:10px;outline:none;transition:border-color .2s;appearance:none}
.lcard select:focus,.lcard input:focus{border-color:var(--black)}
.btn-login{width:100%;padding:13px;background:var(--black);color:white;border:none;
  border-radius:var(--rsm);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;letter-spacing:.03em;transition:opacity .2s}
.btn-login:hover{opacity:.85}
.lerr{color:var(--red);font-size:12px;margin-top:8px;display:none}

/* APP SHELL */
#app{display:none;min-height:100vh}
.topbar{background:var(--black);color:white;padding:0 16px;height:52px;display:flex;
  align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tbl{display:flex;align-items:center;gap:10px}
.tbl img{height:26px;filter:invert(1);opacity:.95}
.tdiv{width:1px;height:22px;background:rgba(255,255,255,.15)}
.tname{font-size:12px;opacity:.6;letter-spacing:.02em}
.tbr{display:flex;align-items:center;gap:8px}
.fbst{font-size:11px;opacity:.7}
.brole{background:white;color:var(--black);font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:20px;letter-spacing:.05em}
.blogout{background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);
  padding:5px 11px;border-radius:var(--rsm);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .2s}
.blogout:hover{border-color:white;color:white}

/* NAV */
.nav{background:white;border-bottom:1.5px solid var(--border);display:flex;overflow-x:auto;
  scrollbar-width:none;padding:0 12px}
.nav::-webkit-scrollbar{display:none}
.ntab{padding:12px 14px;font-size:13px;font-weight:500;color:var(--light);
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
  transition:color .15s,border-color .15s;margin-bottom:-1.5px;letter-spacing:.01em}
.ntab.active{color:var(--black);border-bottom-color:var(--black);font-weight:600}
.ntab:hover{color:var(--dark)}

/* MAIN */
.main{padding:16px;max-width:900px;margin:0 auto}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:20px;margin-bottom:14px;border:1px solid var(--border)}
.ctitle{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--black);
  margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* STARTSEITE KACHELN */
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:4px}
.kachel{background:white;border:1.5px solid var(--border);border-radius:var(--r);
  padding:22px 16px;text-align:center;cursor:pointer;transition:border-color .2s,box-shadow .2s;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.kachel:hover{border-color:var(--black);box-shadow:var(--shadow-md)}
.kachel:active{transform:scale(.98)}
.kachel-icon{font-size:28px}
.kachel-lbl{font-size:13px;font-weight:600;color:var(--dark);letter-spacing:.01em}
.kachel-sub{font-size:11px;color:var(--light)}
.kachel.highlight{border-color:var(--black);background:var(--black)}
.kachel.highlight .kachel-lbl,.kachel.highlight .kachel-sub{color:white}

/* BANNER */
.banner{padding:14px 16px;border-radius:var(--rsm);margin-bottom:14px;
  display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:500}
.banner-warn{background:#1a1a1a;color:white;border-left:4px solid white}
.banner-ok{background:var(--green-lt);color:var(--green);border-left:4px solid var(--green)}
.banner-info{background:var(--blue-lt);color:var(--blue);border-left:4px solid var(--blue)}
.banner-red{background:var(--red-lt);color:var(--red);border-left:4px solid var(--red)}

/* WEEK BAR */
.wbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.wlbl{font-size:11px;color:var(--light);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
input[type=week],input[type=date],input[type=month],input[type=text],input[type=number],textarea,select.finp{
  padding:8px 11px;border:1.5px solid var(--border);border-radius:var(--rsm);
  font-family:'Inter',sans-serif;font-size:13px;color:var(--dark);background:white;outline:none;
  transition:border-color .2s}
input:focus,textarea:focus,select.finp:focus{border-color:var(--black)}

/* STATUS PILLS */
.st{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.03em}
.st-offen{background:#f0f0f0;color:#555}
.st-gepackt{background:var(--blue-lt);color:var(--blue)}
.st-teilweise{background:var(--amber-lt);color:var(--amber)}
.st-versendet{background:#e8f5ed;color:var(--green)}
.st-angekommen{background:var(--green-lt);color:var(--green)}
.st-bestaetigt{background:#e8ffe8;color:#155724}

/* TABLES */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--cream);color:var(--mid);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;text-align:left;
  border-bottom:1.5px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}

/* ORDER ROWS */
.orow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
  padding:10px 13px;background:var(--bg);border-radius:var(--rsm);
  border:1.5px solid var(--border);margin-bottom:5px;transition:border-color .15s}
.orow:hover{border-color:var(--dark)}
.aname{font-weight:500;font-size:13px;color:var(--dark)}
.avpe{font-size:11px;color:var(--light);margin-top:1px}
.qinp{width:72px;padding:10px 8px;border:1.5px solid var(--border);border-radius:var(--rsm);
  font-size:16px;font-family:'Inter',sans-serif;text-align:center;background:white;outline:none;
  min-height:44px;-webkit-appearance:none;}
.qinp:focus{border-color:var(--black)}
.qinp[data-filled="1"]{border-color:var(--black);background:#f0f0f0;font-weight:600}

/* SECTION LABEL */
.slbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--light);
  font-weight:700;margin:12px 0 7px;display:block}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:var(--rsm);font-family:'Inter',sans-serif;font-size:13px;
  font-weight:600;cursor:pointer;border:none;transition:opacity .15s,transform .1s;
  display:inline-flex;align-items:center;gap:5px;letter-spacing:.02em}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--black);color:white}.btn-p:hover{opacity:.85}
.btn-g{background:var(--green);color:white}.btn-g:hover{opacity:.85}
.btn-r{background:var(--red);color:white}.btn-r:hover{opacity:.85}
.btn-o{background:white;border:1.5px solid var(--border);color:var(--dark)}.btn-o:hover{border-color:var(--dark)}
.btn-sm{padding:5px 10px;font-size:12px}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* FORM FIELDS */
.sform input,.sform textarea,.sform select{width:100%;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:var(--rsm);font-family:'Inter',sans-serif;font-size:13px;background:white;
  color:var(--dark);outline:none;margin-bottom:9px;transition:border-color .2s}
.sform textarea{resize:vertical;min-height:75px}
.sform input:focus,.sform textarea:focus,.sform select:focus{border-color:var(--black)}
.flbl{font-size:11px;font-weight:600;color:var(--mid);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:4px;display:block}

/* HISTORY ITEMS */
.hitem{border:1.5px solid var(--border);border-radius:var(--rsm);margin-bottom:6px;overflow:hidden}
.hhead{padding:12px 14px;background:white;display:flex;justify-content:space-between;
  align-items:center;gap:10px;cursor:pointer;user-select:none;transition:background .15s}
.hhead:hover{background:var(--bg)}.hbody{padding:14px;display:none;border-top:1px solid var(--border)}
.hbody.open{display:block}

/* STATS */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.scard{background:white;border:1.5px solid var(--border);border-radius:var(--rsm);
  padding:16px 12px;text-align:center}
.snum{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--black)}
.slabel{font-size:10px;color:var(--light);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}

/* SIG */
canvas#sig-canvas{border:1.5px dashed var(--border);border-radius:var(--rsm);width:100%;
  height:90px;cursor:crosshair;touch-action:none;background:white;display:none}
.sig-area{border:1.5px dashed var(--border);border-radius:var(--rsm);height:60px;display:flex;
  align-items:center;justify-content:center;color:var(--light);font-size:13px;
  cursor:pointer;transition:border-color .15s;margin-top:8px}
.sig-area:hover{border-color:var(--dark)}
.sigctrl{display:none;gap:6px;margin-top:5px}.sigctrl.vis{display:flex}

/* FILTER */
.frow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.frow select,.frow input{padding:7px 10px;border:1.5px solid var(--border);
  border-radius:var(--rsm);font-family:'Inter',sans-serif;font-size:13px;
  background:white;color:var(--dark);outline:none}
.frow select:focus,.frow input:focus{border-color:var(--black)}

/* INVENTUR */
.invrow{display:grid;grid-template-columns:1fr 75px 75px 55px;gap:8px;align-items:center;
  padding:9px 12px;background:var(--bg);border-radius:var(--rsm);
  border:1.5px solid var(--border);margin-bottom:5px}
.iinp{padding:6px 8px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:13px;
  font-family:'Inter',sans-serif;text-align:center;outline:none;background:white;width:100%}
.iinp:focus{border-color:var(--black)}
.dpos{color:var(--green);font-weight:700;font-size:13px;text-align:center}
.dneg{color:var(--red);font-weight:700;font-size:13px;text-align:center}

/* LAGER */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.litem{background:white;border:1.5px solid var(--border);border-radius:var(--rsm);padding:14px;position:relative}
.litem.warn{border-color:var(--amber)}.litem.crit{border-color:var(--red)}
.lname{font-weight:600;font-size:13px;margin-bottom:4px}
.lqty{font-size:1.5rem;font-weight:700;font-family:'Playfair Display',serif;color:var(--black)}
.lunit{font-size:11px;color:var(--light)}.lwbadge{position:absolute;top:8px;right:8px;font-size:13px}
.lerow{display:flex;gap:6px;margin-top:8px}
.lerow input{flex:1;padding:5px 7px;border:1.5px solid var(--border);border-radius:var(--rsm);
  font-size:13px;font-family:'Inter',sans-serif;outline:none;min-width:0}

/* TIMELINE */
.tline{border-left:2px solid var(--border);padding-left:14px;margin-left:5px}
.tli{position:relative;margin-bottom:10px}
.tli::before{content:'';position:absolute;left:-19px;top:4px;width:8px;height:8px;
  border-radius:50%;background:var(--dark);border:2px solid white;box-shadow:0 0 0 2px var(--border)}
.tld{font-size:11px;color:var(--light);margin-bottom:1px}

/* ARTIKEL VERWALTUNG */
.art-mgmt-row{display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:white;border:1.5px solid var(--border);border-radius:var(--rsm);margin-bottom:5px}
.art-mgmt-row:hover{border-color:var(--dark)}
.art-mgmt-row.drag-over{border:2px dashed var(--black);background:#f5f5f5}
.art-mgmt-row.dragging{opacity:0.4}
.drag-handle{cursor:grab;color:var(--light);font-size:16px;padding:0 4px;user-select:none;flex-shrink:0}
.drag-handle:active{cursor:grabbing}

/* PRINT */
@media print{#login-screen,.topbar,.nav,.btn,.brow,.frow,.no-print,canvas{display:none!important}
  .hbody{display:block!important}.card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}
  body{background:white;font-size:12px}}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--black);color:white;
  padding:12px 16px;border-radius:var(--rsm);font-size:13px;font-weight:500;
  box-shadow:var(--shadow-md);z-index:9999;transform:translateY(80px);opacity:0;
  transition:transform .3s,opacity .3s;max-width:300px}
.toast.show{transform:translateY(0);opacity:1}

/* PACKEN MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:white;border-radius:var(--r);padding:24px;max-width:500px;width:100%;
  max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-title{font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:16px}
.pack-row{display:grid;grid-template-columns:1fr 70px 70px;gap:8px;align-items:center;
  padding:8px 10px;background:var(--bg);border-radius:var(--rsm);margin-bottom:5px;font-size:13px}
.pack-row.fehlend{border-left:3px solid var(--red)}
.pack-inp{padding:6px 8px;border:1.5px solid var(--border);border-radius:var(--rsm);
  font-size:13px;font-family:'Inter',sans-serif;text-align:center;outline:none;background:white;width:100%}
.pack-inp:focus{border-color:var(--black)}

hr.div{border:none;border-top:1px solid var(--border);margin:12px 0}
@media(max-width:600px){.main{padding:12px}.card{padding:14px}.kacheln{grid-template-columns:1fr 1fr}
  .invrow{grid-template-columns:1fr 60px 60px 45px}.sgrid{grid-template-columns:1fr 1fr}
  .lgrid{grid-template-columns:1fr 1fr}}
</style>
</head>

function loadBaekoFromSheet(forcedFilialen){
  // Sheet ist Master für BÄKO – immer alle Filialen laden
  const toLoad=forcedFilialen||BAEKO_FILIALEN;
  const promises=toLoad.map(fil=>{
    const url=`https://docs.google.com/spreadsheets/d/${BAEKO_SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(fil)}`;
    return fetch(url)
      .then(r=>r.text())
      .then(text=>{
        const json=JSON.parse(text.replace(/^[^{]*|[^}]*$/g,''));
        const rows=json.table?.rows;
        if(!rows||!rows.length)return;
        const items=[];
        rows.forEach(row=>{
          const c=row.c;
          if(!c||!c[1]||!c[1].v)return; // Bezeichnung Pflicht
          const id=c[0]?String(c[0].v||'').trim():'';
          const name=String(c[1].v||'').trim();
          const kat=c[2]?String(c[2].v||'').trim():'';
          if(name)items.push({id,name,kat});
        });
        if(items.length>0){
          BAEKO[fil]=items;
          const seen={};const dupes=[];
          items.forEach(a=>{
            if(!a.id)return;
            if(seen[a.id])dupes.push(`${seen[a.id]} ↔ ${a.name} (Nr. ${a.id})`);
            else seen[a.id]=a.name;
          });
          if(dupes.length){
            console.warn(`⚠️ Doppelte Artikelnummer bei ${fil}: ${dupes.join(', ')}`);
            if(U==='Verwaltung')toast(`⚠️ ${fil}: doppelte Artikelnummer – ${dupes.join(', ')}`);
          }
        }
      })
      .catch(e=>console.warn(`Sheet-Tab ${fil} fehlgeschlagen:`,e));
  });
  Promise.all(promises).then(()=>{
    console.log(`BÄKO-Listen aus Google Sheet geladen: ${toLoad.join(', ')}`);
  });
}

function initFirebase(){
  try{
    if(fbRef){fbRef.off();fbRef=null;}
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);else firebase.app();
    fbRef=firebase.database().ref('bock');
    fbReady=true;
    let lastOrdCount=-1,lastSondCount=-1,lastReinCount=-1;
    const knownSonderIds=new Set(),knownReinIds=new Set();
    fbRef.on('value',snap=>{
      const data=snap.val();
      if(data){
        db.bestellungen=data.bestellungen?Object.values(data.bestellungen):[];
        db.sonder=data.sonder?Object.values(data.sonder):[];
        db.inventuren=data.inventuren?Object.values(data.inventuren):[];
        db.verkaufszahlen=data.verkaufszahlen||{};
        db.inventurAnfang=data.inventurAnfang||{};
        db.lager=data.lager||db.lager;
        db.lagerLog=data.lagerLog?Object.values(data.lagerLog):[];
        // BÄKO wird über Google Sheet gepflegt – baeko_artikel in Firebase wird ignoriert
        // HW-Artikel kommen aus Google Sheet – nicht aus Firebase
        if(data.lager_artikel&&data.lager_artikel.length){
          LAGER_ART.length=0;
          data.lager_artikel.forEach(a=>LAGER_ART.push(a));
        }
        if(data.reinigung_artikel&&data.reinigung_artikel.length){
          REINIGUNG_ART.length=0;
          data.reinigung_artikel.forEach(a=>REINIGUNG_ART.push(a));
        }
        if(data.kuehltheke)db.kuehltheke=data.kuehltheke;
        if(data.reinigung)db.reinigung=Object.values(data.reinigung);
        if(data.putzplan)db.putzplan=data.putzplan;
      }
      // Benachrichtigungen für B1 + Verwaltung
      if((U==='B1'||U==='Verwaltung')&&lastOrdCount>=0){
        if(db.bestellungen.length>lastOrdCount){
          const n=db.bestellungen[db.bestellungen.length-1];
          showNotif('📋 Neue Bestellung',`${n?.filiale||''} · KW ${n?.week||''} · ${n?.typ==='baeko'?'Bäko':'Metro'}`);
        }
        if(db.sonder.length>lastSondCount){
          const n=db.sonder[db.sonder.length-1];
          showNotif('⭐ Neue Sonderbestellung',`${n?.filiale||''} · ${n?.datum||''}`);
        }
      }
      // Automatischer Druck für Backstube
      if(U==='Backstube'){
        const erstInit=knownSonderIds.size===0;
        // ZUERST filtern (bevor neue IDs ins Set kommen), DANN hinzufügen
        const neueSonder=erstInit?[]:db.sonder.filter(s=>s&&s.id&&!knownSonderIds.has(s.id));
        db.sonder.forEach(s=>s&&s.id&&knownSonderIds.add(s.id));
        neueSonder.forEach(s=>{
          showNotif('🖨️ Neue Sonderbestellung',`${s?.filiale||''} wird gedruckt…`);
          setTimeout(()=>printBsSonder(s.id,true),600);
        });
      }
      if(U==='Backstube'){
        const erstInitR=knownReinIds.size===0;
        const neueRein=erstInitR?[]:(db.reinigung||[]).filter(r=>r&&r.id&&!knownReinIds.has(r.id));
        (db.reinigung||[]).forEach(r=>r&&r.id&&knownReinIds.add(r.id));
        neueRein.forEach(r=>{
          showNotif('🖨️ Neue Reinigungsbestellung',`${r?.filiale||''} wird gedruckt…`);
          setTimeout(()=>printReinigung(r.id,true),600);
        });
      }
      lastOrdCount=db.bestellungen.length;
      lastSondCount=db.sonder.length;
      lastReinCount=(db.reinigung||[]).length;
      // Live-Update der aktuellen Ansicht – nur wenn kein Modal offen und kein Input fokussiert
      const active=document.querySelector('.ntab.active');
      const modalOffen=document.querySelector('.modal[style*="flex"],.modal[style*="block"]');
      const inputFokussiert=document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
      if(active&&U&&!modalOffen&&!inputFokussiert)renderPanel(active.dataset.p);
      // Startseite neu laden für Banner
      if(U)updateStartBanner();
    });
    setFbSt('☁️','#1a7a3a');
  }catch(e){
    console.warn('Firebase offline:',e);fbReady=false;setFbSt('⚠️','#c0392b');
    showOfflineBanner();
    try{const d=localStorage.getItem('bock_db');if(d)db=JSON.parse(d);}catch{}
  }
}

function cw(){const n=new Date(),d=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));const wn=Math.ceil((((d-ys)/86400000)+1)/7);return d.getUTCFullYear()+'-W'+String(wn).padStart(2,'0');}
function getNextWeekDates(){
  // Montag und Sonntag der nächsten Woche
  const n=new Date();
  const day=n.getDay()||7; // 1=Mo...7=So
  const diff=8-day; // Tage bis nächsten Montag
  const mo=new Date(n);mo.setDate(n.getDate()+diff);
  const so=new Date(mo);so.setDate(mo.getDate()+6);
  return {mo,so};
}

// Lokales Datum als ISO-String (YYYY-MM-DD) – vermeidet UTC-Versatz (z.B. UTC+2 → Tag -1)
function localISO(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),t=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${t}`;
}
function today(){return localISO(new Date());}

function thisWeekMoISO(){
  const now=new Date();const day=now.getDay()||7;
  const mo=new Date(now);mo.setDate(now.getDate()-(day-1));
  return localISO(mo);
}
function thisWeekFrISO(){
  const mo=new Date(thisWeekMoISO());mo.setDate(mo.getDate()+4);
  return localISO(mo);
}
function naechsterMontag(){
  const now=new Date();
  const dow=now.getDay()||7;
  const diff=dow===1?7:(8-dow);
  const mo=new Date(now);mo.setDate(now.getDate()+diff);
  return localISO(mo);
}
function naechsterFreitag(){
  const now=new Date();
  const dow=now.getDay()||7;
  const diff=dow===5?7:((5-dow+7)%7)||7;
  const fr=new Date(now);fr.setDate(now.getDate()+diff);
  return localISO(fr);
}
function moFromDate(dateISO){
  if(!dateISO)return today();
  // dateISO aus date-Input ist lokal → direkt parsen ohne UTC-Shift
  const parts=dateISO.split('-');
  const d=new Date(+parts[0],+parts[1]-1,+parts[2]);
  const day=d.getDay()||7;
  d.setDate(d.getDate()-(day-1));return localISO(d);
}
function getPickerDate(id){
  const el=document.getElementById('wmiso-'+id);
  if(el&&el.value)return el.value;
  return id==='baeko'?naechsterMontag():naechsterFreitag();
}

// ═══════════════════ B1: Samstags-Erinnerung für offene Nachlieferungen ═══════════════════
// Läuft nur, während die App im Browser offen/geladen ist (kein Service Worker/Push im Hintergrund) —
// prüft beim Login/Öffnen einmal pro Tag, ob samstags noch Fehlmengen dieser Woche offen sind.
function pruefeNachliefernErinnerung(){
  if(U!=='B1')return;
  if(new Date().getDay()!==6)return; // nur samstags
  const heute=today();
  let letzte=null;
  try{letzte=localStorage.getItem('bock_nachliefer_erinnerung');}catch{}
  if(letzte===heute)return; // heute schon erinnert
  const dieseWoche=thisWeekMoISO();
  const relevanteWoche=b=>(b.wocheMo||b.week||moFromDate(b.versanddatum||b.datum?.slice(0,10)))>=dieseWoche;
  const teilweise=db.bestellungen.filter(b=>b.typ==='metro'&&b.status==='teilweise'&&relevanteWoche(b));
  if(!teilweise.length)return;
  const filialen=[...new Set(teilweise.map(b=>b.filiale))].join(', ');
  showNotif('🔄 Nachliefern nicht vergessen',`${teilweise.length} Bestellung(en) noch offen: ${filialen}`);
  try{localStorage.setItem('bock_nachliefer_erinnerung',heute);}catch{}
}

function doLogin(){
  const f=document.getElementById('lf').value,p=document.getElementById('lpw').value;
  if(!f){showErr('Filiale wählen.');return;}
  if(p!==PW[f]){showErr('Falsches Passwort.');return;}
  U=f;
  // Login persistieren
  try{localStorage.setItem('bock_session',f);}catch{}
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('trole').textContent=f;
  document.getElementById('tname').textContent='';
  if('Notification' in window&&Notification.permission==='default'&&(U==='B1'||U==='Verwaltung'))
    Notification.requestPermission();
  initFirebase();
  buildNav();renderPanel('start');
  pruefeNachliefernErinnerung();
}
function doLogout(){
  U=null;
  try{localStorage.removeItem('bock_session');}catch{}
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('lpw').value='';
  if(fbRef)fbRef.off();fbRef=null;fbReady=false;
  removeOfflineBanner();
}

// Kompakte Ein-Zeilen-Zusammenfassung für die Startseite (statt der vollen Matrix):
// "X/8 Filialen haben BÄKO bestellt, Y/8 HW" für die aktuelle Bestellwoche.
function renderVwWeekSummary(){
  const el=document.getElementById('vw-week-summary');if(!el)return;
  const off=window._vwWeekOffset||0;
  const now=new Date();const dow=now.getDay()||7;
  const mo=new Date(now);mo.setDate(now.getDate()-(dow-1)+(off*7));mo.setHours(0,0,0,0);
  const fr=new Date(mo);fr.setDate(mo.getDate()+4);
  const moISO=localISO(mo);const frISO=localISO(fr);
  const kwLabel='KW '+mo.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+'–'+fr.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
  const hatBestellt=typ=>ALLE_FIL.filter(fil=>db.bestellungen.some(b=>b.filiale===fil&&b.typ===typ&&(b.wocheMo===moISO||b.versanddatum===frISO||b.versanddatum===moISO||(b.wocheMo>=moISO&&b.wocheMo<=frISO)))).length;
  const baeko=hatBestellt('baeko'),hw=hatBestellt('metro');
  const gesamt=ALLE_FIL.length;
  const teilweise=ALLE_FIL.filter(fil=>db.bestellungen.some(b=>b.filiale===fil&&(b.wocheMo===moISO||b.versanddatum===frISO||b.versanddatum===moISO)&&b.status==='teilweise')).length;
  el.innerHTML=`📅 <strong>${kwLabel}</strong> · 🌾 ${baeko}/${gesamt} BÄKO · 📦 ${hw}/${gesamt} HW bestellt${teilweise?` · ⚠️ ${teilweise} mit Fehlmengen`:''}`;
}

function updateStartBanner(){
  const div=document.getElementById('start-banner');if(!div)return;
  let html='';

  // B1: eigener Hinweis entfällt hier — steht bereits detailliert (und wochenbegrenzt) in der
  // "📦 HW-Bestellungen"-Karte auf der Startseite, kein doppelter Banner nötig.
  // Verwaltung: kompakte Sammelkarte statt einzelner Banner
  if(U==='Verwaltung'){
    const offen=db.bestellungen.filter(b=>b.status==='offen');
    const baeko_offen=offen.filter(b=>b.typ==='baeko');
    const hw_offen=offen.filter(b=>b.typ==='metro');
    const fehlend=db.bestellungen.filter(b=>b.fehlmengen&&Object.keys(b.fehlmengen).filter(k=>b.fehlmengen[k]>0).length>0&&b.status!=='bestaetigt');
    const kritischFehlend=fehlend.filter(b=>{
      if(b.typ!=='metro'||!b.fehlmengen)return false;
      return Object.entries(b.fehlmengen).some(([id,v])=>{if(v<=0)return false;const art=(b.positionen||[]).find(p=>p.id===id);return art&&istKritisch(art.name);});
    });
    const abweichungen=db.bestellungen.filter(b=>b.hatAbweichung&&b.status!=='bestaetigt');
    const items=[];
    if(baeko_offen.length)items.push({icon:'🌾',label:`${baeko_offen.length} BÄKO offen`,cls:'warn',action:"renderPanel('vw-best-hwbaeko')"});
    if(hw_offen.length)items.push({icon:'📦',label:`${hw_offen.length} HW offen`,cls:'warn',action:"renderPanel('vw-best-hwbaeko')"});
    if(kritischFehlend.length){const f=[...new Set(kritischFehlend.map(b=>b.filiale))].join(', ');items.push({icon:'🚨',label:`Kritische Fehlmengen bei ${f}`,cls:'red',action:"renderPanel('vw-best-hwbaeko')"});}
    else if(fehlend.length)items.push({icon:'⚠️',label:`${fehlend.length} offene Fehlmengen`,cls:'red',action:"renderPanel('vw-best-hwbaeko')"});
    if(abweichungen.length)items.push({icon:'📬',label:`${abweichungen.length} Lieferung(en) mit Abweichungen`,cls:'red',action:"renderPanel('bestellhistorie')"});
    if(items.length){
      html+=`<div style="background:var(--card);border:1.5px solid var(--border);border-radius:var(--rsm);padding:10px 14px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px">`;
      items.forEach(it=>{
        const bg=it.cls==='red'?'var(--red-lt)':it.cls==='warn'?'#FAEEDA':'var(--green-lt)';
        const col=it.cls==='red'?'var(--red)':it.cls==='warn'?'#633806':'var(--green)';
        html+=`<button onclick="${it.action}" style="background:${bg};color:${col};border:none;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">${it.icon} ${it.label} →</button>`;
      });
      html+=`</div>`;
    }
  }



  // Verwaltung: Banner für neu angekommene Lieferungen
  if(U==='Verwaltung'){
    const neuAngekommen=db.bestellungen.filter(b=>b.status==='angekommen'&&!b.vwGesehen);
    if(neuAngekommen.length){
      const typen=[...new Set(neuAngekommen.map(b=>b.typ==='baeko'?'🌾 BÄKO':'📦 HW'))].join(' · ');
      const filialen=[...new Set(neuAngekommen.map(b=>fname(b.filiale)))].join(', ');
      html+=`<div class="banner banner-ok">📬 <strong>${neuAngekommen.length} Lieferung(en) angekommen</strong> – ${filialen} (${typen}). <span style="text-decoration:underline;cursor:pointer" onclick="markVwGesehenAndGo()">Jetzt ansehen →</span></div>`;
    }
  }

  // Filiale: Lieferung unterwegs – bitte bestätigen (BÄKO + HW)
  if(!['Verwaltung','Backstube'].includes(U)){
    const versendet=db.bestellungen.filter(b=>b.filiale===U&&b.status==='versendet'&&(b.typ==='metro'||b.typ==='baeko')&&(U!=='B1'||b.typ==='baeko'));
    versendet.forEach(b=>{
      const typLbl=b.typ==='baeko'?'🌾 BÄKO':'📦 HW';
      html+=`<div style="background:var(--black);color:white;border-radius:var(--rsm);
        padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer"
        onclick="openAngekommenModal('${b.id}')">
        <div>
          <div style="font-weight:700;font-size:15px">🚚 Lieferung unterwegs!</div>
          <div style="font-size:12px;opacity:.8;margin-top:3px">${typLbl} · Bestellt am ${new Date(b.datum).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})} · Bitte bestätigen wenn angekommen</div>
        </div>
        <div style="background:white;color:var(--black);font-weight:700;font-size:13px;
          padding:8px 14px;border-radius:var(--rsm);white-space:nowrap">
          📬 Jetzt bestätigen
        </div>

function checkBEx(){
  const al=document.getElementById('bal');if(!al)return;
  const frISO=getPickerDate('baeko');

}

function histCutoffISO(){
  const d=new Date();d.setMonth(d.getMonth()-2);d.setDate(1);
  return d.toISOString().slice(0,10);
}
function toggleHistShowAll(){
  window._histShowAll=!window._histShowAll;
  const btn=document.getElementById('hist-toggle-btn');
  if(btn)btn.textContent=window._histShowAll?'🕐 Nur letzte 2 Monate zeigen':'🕐 Ältere Bestellungen anzeigen';
  refreshHist();
}
function csvEsc(v){
  const s=(v===undefined||v===null)?'':String(v);
  return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function exportHistCSV(){
  const items=window._histLastCombined||[];
  if(!items.length){toast('Keine Einträge zum Export.');return;}
  const rows=[['Datum','Filiale','Art','Status','Positionen/Text','Fehlmengen']];
  items.forEach(item=>{
    const datum=(item._sortKey||'').slice(0,10);
    if(item._art==='bestellung'){
      const posText=(item.positionen||[]).map(p=>`${p.name} ×${p.menge}`).join(' | ');
      const fehlText=item.fehlmengen?Object.entries(item.fehlmengen).filter(([,v])=>v>0)
        .map(([id,v])=>{const p=(item.positionen||[]).find(x=>x.id===id);return`${p?.name||id}: −${v}`;}).join(' | '):'';
      rows.push([datum,item.filiale,item.typ==='baeko'?'BÄKO':'HW',stlbl(item.status),posText,fehlText]);
    }else if(item._art==='sonder'){
      rows.push([datum,item.filiale,'Sonderbestellung',stlbl(item.status),item.text||item.bestellung||'',item.fehlmeldung||'']);
    }else if(item._art==='reinigung'){
      const posText=(item.positionen||[]).map(p=>`${p.name} ×${p.menge}`).join(' | ');
      rows.push([datum,item.filiale,'Reinigung',stlbl(item.status||'offen'),posText,item.fehlmeldung||'']);
    }
  });
  const csv=rows.map(r=>r.map(csvEsc).join(';')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`Bestellhistorie_${today()}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('⬇️ CSV exportiert');
}

function renderBsSonder(){
  const mc=document.getElementById('mc');
  const alle=(db.sonder||[]).slice().sort((a,b)=>(b.erstellt||b.datum||'').localeCompare(a.erstellt||a.datum||''));

  const byDate={};
  alle.forEach(s=>{
    const d=(s.erstellt||s.datum||'').slice(0,10)||'unbekannt';
    if(!byDate[d])byDate[d]=[];
    byDate[d].push(s);
  });
  const dateKeys=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));

  const sonderItem=s=>{
    const lieferdatum=s.datum_liefer||s.datum;
    const lieferFmt=lieferdatum?new Date(lieferdatum.length>10?lieferdatum:lieferdatum+'T00:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}):null;
    return`<div class="hitem" style="margin-bottom:6px">
      <div class="hhead" onclick="th(this)" style="padding:10px 14px">
        <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
          <span style="font-weight:700;font-size:14px">${fname(s.filiale)}</span>
          ${lieferFmt?`<span style="font-size:12px;color:var(--mid)">für ${lieferFmt}</span>`:''}
          ${s.tour?`<span style="font-size:12px;color:var(--light)">· ${s.tour}</span>`:''}
          ${s.name?`<span style="font-size:11px;color:var(--light)">· ${s.name}</span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span style="font-size:11px;color:var(--light)">${s.erstellt?new Date(s.erstellt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''}</span>
          <span class="st ${stcls(s.status||'offen')}">${stlbl(s.status||'offen')}</span>
          <span style="color:var(--xlight);font-size:16px">›</span>
        </div>
      </div>
      <div class="hbody" style="padding:10px 14px">
        ${s.text?`<div style="font-size:13px;white-space:pre-wrap;margin-bottom:8px">${s.text}</div>`:''}
        ${s.fehlmeldung?`<div style="font-size:12px;background:#fff3cd;border:1px solid #ffc107;border-radius:var(--rsm);padding:8px 10px;margin-bottom:8px">⚠️ <strong>Fehlmeldung:</strong> ${s.fehlmeldung}</div>`:''}
        <div class="brow no-print" style="margin-top:6px">
          <button class="btn btn-o btn-sm" onclick="printBsSonder('${s.id}')">🖨️ Laufzettel drucken</button>
          ${s.status==='teilweise'?`<button class="btn btn-p btn-sm" onclick="event.stopPropagation();finalisiereSonder('${s.id}')">✅ Jetzt vollständig</button>`:''}
        </div>
      </div>
    </div>`;
  };

  const grouped=dateKeys.length?dateKeys.map(d=>{
    const lbl=d!=='unbekannt'?new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}):'-';
    return`<div style="margin-bottom:18px">
      <div style="font-size:13px;font-weight:700;padding:6px 0;border-bottom:1.5px solid var(--border);margin-bottom:8px">${lbl}</div>
      ${byDate[d].map(sonderItem).join('')}
    </div>`;
  }).join('')
  :`<p style="color:var(--light);font-size:13px;padding:10px 0">Keine Sonderbestellungen vorhanden.</p>`;

  mc.innerHTML=`<div class="card">
    <div class="ctitle">🎂 Sonderbestellungen</div>
    <p style="font-size:12px;color:var(--light);margin-bottom:14px">Alle eingegangenen Aufträge – neueste zuerst</p>
    ${grouped}
  </div>`;
}

function bestaetigenBestellung(id){
  const b=db.bestellungen.find(x=>x.id===id);
  if(!b)return;
  b.status='bestaetigt';
  if(!b.statusLog)b.statusLog=[];
  b.statusLog.push({status:'bestaetigt',datum:new Date().toISOString(),by:U});
  save();
  toast('✅ Bestellung bestätigt!');
  if(typeof renderStart==='function')renderStart();
}

function bestaetigeRein(id,mitFehler=false){
  const r=(db.reinigung||[]).find(x=>x.id===id);
  if(!r)return;
  if(!r.statusLog)r.statusLog=[];
  if(mitFehler){
    const fehlText=document.getElementById('rein-fehl-text')?.value?.trim();
    r.status='teilweise';
    if(fehlText)r.fehlmeldung=fehlText;
    r.statusLog.push({status:'teilweise',datum:new Date().toISOString(),by:U,fehlmeldung:fehlText||''});
    toast('⚠️ Bestätigt – Fehlmeldung gespeichert');
  }else{
    r.status='erledigt';
    r.statusLog.push({status:'erledigt',datum:new Date().toISOString(),by:U});
    toast('✅ Reinigungsbestellung bestätigt!');
  }
  save();closeModal();
  if(typeof renderStart==='function')renderStart();
  updateStartBanner();refreshHist();
}
function finalisiereRein(id){
  const r=(db.reinigung||[]).find(x=>x.id===id);if(!r)return;
  r.status='erledigt';
  delete r.fehlmeldung;
  if(!r.statusLog)r.statusLog=[];
  r.statusLog.push({status:'erledigt',datum:new Date().toISOString(),by:U,note:'Nachlieferung erhalten'});
  save();
  toast('✅ Reinigungsbestellung vollständig!');
  if(typeof renderStart==='function')renderStart();
  updateStartBanner();refreshHist();
}

function bestaetigeSonder(id, mitFehler=false){
  const s=db.sonder.find(x=>x.id===id);

  if(mitFehler){

function finalisiereSonder(id){

  s.status='bestaetigt';
  delete s.fehlmeldung;
  if(!s.statusLog)s.statusLog=[];
  s.statusLog.push({status:'bestaetigt',datum:new Date().toISOString(),by:U,note:'Nachlieferung erhalten'});
  save();
  toast('✅ Sonderbestellung vollständig!');
  if(typeof renderStart==='function')renderStart();
  refreshHist();
}

function markVwGesehenAndGo(){
  db.bestellungen.filter(b=>b.status==='angekommen'&&!b.vwGesehen).forEach(b=>{b.vwGesehen=true;});
  save();renderPanel('bestellhistorie');
}

function refreshHist(){
  const isAll=U==='Verwaltung'||U==='Backstube';
  const datFilter=document.getElementById('hw')?.value||'';
  const fil=document.getElementById('hfil')?.value||'';
  const st=document.getElementById('hst')?.value||'';
  const list=document.getElementById('hlist');if(!list)return;
  const cutoff=(!datFilter&&!window._histShowAll)?histCutoffISO():null;

  // Bäko + HW Bestellungen
  let orders=db.bestellungen.filter(b=>{
    if(U==='B1'){
      // B1 sieht: eigene Bestellungen + fremde HW zum Packen
      const eigenB1=b.filiale==='B1';
      const fremdeHW=b.typ==='metro'&&b.filiale!=='B1';
      if(!eigenB1&&!fremdeHW)return false;
      if(datFilter&&b.datum.slice(0,10)!==datFilter)return false;
      if(cutoff&&b.datum.slice(0,10)<cutoff)return false;
      if(st&&b.status!==st)return false;
      return true;
    }
    if(U!=='Verwaltung'&&U!=='Backstube'&&b.filiale!==U)return false;
    if(datFilter&&b.versanddatum!==datFilter&&b.datum.slice(0,10)!==datFilter)return false;
    if(cutoff&&b.datum.slice(0,10)<cutoff)return false;
    if(fil&&b.filiale!==fil)return false;
    if(st&&b.status!==st)return false;
    return true;
  });

  // Sonderbestellungen — B1 sieht nur eigene
  let sonders=(db.sonder||[]).filter(s=>{
    if(U==='B1'&&s.filiale!=='B1')return false;
    if(U!=='Verwaltung'&&U!=='Backstube'&&U!=='B1'&&s.filiale!==U)return false;
    if(datFilter&&s.datum!==datFilter&&(s.erstellt||'').slice(0,10)!==datFilter)return false;
    if(cutoff&&(s.erstellt||s.datum||'').slice(0,10)<cutoff)return false;
    if(fil&&s.filiale!==fil)return false;
    if(st&&s.status!==st)return false;
    return true;
  });

  // Reinigungsbestellungen
  let reinigungen=(db.reinigung||[]).filter(r=>{
    if(U!=='Verwaltung'&&U!=='Backstube'&&r.filiale!==U)return false;
    if(cutoff&&(r.datum||'').slice(0,10)<cutoff)return false;
    if(datFilter&&(r.datum||'').slice(0,10)!==datFilter)return false;
    if(fil&&r.filiale!==fil)return false;
    return true;
  });

  // Alles zusammen nach Eingangsdatum sortiert (neueste zuerst)
  const combined=[
    ...orders.map(o=>({...o,_art:'bestellung',_sortKey:o.datum})),
    ...sonders.map(s=>({...s,_art:'sonder',_sortKey:s.erstellt||s.datum})),
    ...reinigungen.map(r=>({...r,_art:'reinigung',_sortKey:r.datum}))
  ].sort((a,b)=>b._sortKey.localeCompare(a._sortKey));
  window._histLastCombined=combined;

  if(!combined.length){list.innerHTML='<p style="color:var(--light);font-size:13px">Keine Einträge gefunden.</p>';return;}

  // Gruppieren nach Datum
  const byDate={};
  combined.forEach(item=>{
    const d=(item._sortKey||'').slice(0,10)||'unbekannt';
    if(!byDate[d])byDate[d]=[];
    byDate[d].push(item);
  });
  const dateKeys=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));

  list.innerHTML=dateKeys.map(d=>{
    const dateLbl=d!=='unbekannt'?new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}):'-';
    const itemsHTML=byDate[d].map(item=>{
    if(item._art==='sonder'){
      const lieferdatum=item.datum_liefer||item.datum;
      const lieferFmt=lieferdatum?new Date(lieferdatum.length>10?lieferdatum:lieferdatum+'T00:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}):null;
      const eingang=dts(item.erstellt);
      if(isAll){
        return`<div class="hitem">
        <div class="hhead" onclick="th(this)">
          <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
            <span style="font-weight:700;font-size:14px">${fname(item.filiale)}</span>
            <span style="font-size:12px;color:var(--mid)">🎂 Sonderbestellung</span>
            ${lieferFmt?`<span style="font-size:11px;color:var(--light)">für ${lieferFmt}</span>`:''}
            ${item.tour?`<span style="font-size:11px;color:var(--light)">· ${item.tour}</span>`:''}
          </div>
          <div style="display:flex;align-items:center;gap:7px;flex-shrink:0">
            <span style="font-size:11px;color:var(--light)">${eingang} · ${item.name||''}</span>
            <span class="st ${stcls(item.status)}">${stlbl(item.status)}</span>
            <span style="color:var(--xlight)">›</span>
          </div>
        </div>
        <div class="hbody">
          ${item.text?`<p style="font-size:13px;margin-bottom:8px">${item.text}</p>`:''}
          ${item.tour?`<p style="font-size:12px;color:var(--light)">Tour: ${item.tour}</p>`:''}
          ${(U==='Verwaltung'||U==='Backstube')?`<div class="brow"><button class="btn btn-o btn-sm" onclick="printBsSonder('${item.id}')">🖨️ Laufzettel</button></div>`:''}
        </div>
      </div>`;
      }
      // Filial-Ansicht: neues Layout
      return`<div class="hitem">
        <div class="hhead" onclick="th(this)">
          <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
            <div style="background:var(--black);color:white;border-radius:6px;padding:5px 9px;text-align:center;flex-shrink:0;min-width:46px">
              <div style="font-size:9px;color:#aaa;text-transform:uppercase;letter-spacing:.04em">für</div>

              <div style="font-size:13px;font-weight:700">${item.filiale} · 🎂 Sonderbestellung</div>
              <div style="font-size:11px;color:var(--light);margin-top:2px">Abgeschickt: ${eingang} · ${item.name||''}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:7px;flex-shrink:0">
            <span class="st ${stcls(item.status)}">${stlbl(item.status)}</span>
            <span style="color:var(--xlight)">›</span>
          </div>
        </div>
        <div class="hbody">
          ${item.text?`<p style="font-size:13px;margin-bottom:8px">${item.text}</p>`:''}
          ${item.fehlmeldung?`<div style="font-size:12px;background:#fff3cd;border:1px solid #ffc107;border-radius:var(--rsm);padding:8px 10px;margin-top:8px">⚠️ <strong>Fehlmeldung:</strong> ${item.fehlmeldung}</div>`:''}
          ${item.status==='offen'&&item.filiale===U?`<div class="brow" style="margin-top:8px">
            <button class="btn btn-p btn-sm" onclick="event.stopPropagation();openSonderBestaetigModal('${item.id}')">✅ Bestellung bestätigen</button>
          </div>`:''}
          ${item.status==='teilweise'&&item.filiale===U?`<div class="brow" style="margin-top:8px">
            <button class="btn btn-o btn-sm" onclick="event.stopPropagation();finalisiereSonder('${item.id}')">✅ Jetzt vollständig</button>

    }
    if(item._art==='reinigung'){
      const r=item;
      const datFmt=r.datum?new Date(r.datum).toLocaleString('de-DE'):'-';
      const rst=r.status||'offen';
      return`<div class="hitem">
        <div class="hhead" onclick="th(this)">
          <div>
            <strong>${fname(r.filiale)}</strong> · 🧴 Reinigung

          </div>
          <div style="display:flex;align-items:center;gap:7px">
            ${rst!=='offen'?`<span class="st ${stcls(rst==='erledigt'?'bestaetigt':rst)}">${rst==='erledigt'?'Erledigt':stlbl(rst)}</span>`:''}
            ${(rst==='offen'&&r.filiale===U)?`<button class="btn btn-p btn-sm no-print" onclick="event.stopPropagation();openReinBestaetigModal('${r.id}')">✅ Bestätigen</button>`:''}
            ${(rst==='teilweise'&&r.filiale===U)?`<button class="btn btn-o btn-sm no-print" onclick="event.stopPropagation();finalisiereRein('${r.id}')">✅ Jetzt vollständig</button>`:''}
            <span style="color:var(--xlight)">›</span>

    const o=item;

          ${(U==='B1'&&o.typ==='metro'&&o.status==='offen')?`<button class="btn btn-p btn-sm no-print" onclick="event.stopPropagation();openPackenModal('${o.id}')">📦 Packen</button>`:''}

        ${(U==='B1'&&o.typ==='metro'&&(o.status==='offen'||o.status==='teilweise'))||(U==='Verwaltung'&&o.typ==='baeko'&&o.status==='teilweise')?`

          ${(U==='B1'&&o.typ==='metro'&&o.status==='teilweise')?`<button class="btn btn-o btn-sm" onclick="event.stopPropagation();openPackenModal('${o.id}')">🔄 Nachliefern</button>`:''}
          ${(U==='Verwaltung'&&o.typ==='baeko'&&o.status==='teilweise')?`<button class="btn btn-o btn-sm" onclick="event.stopPropagation();openPackenModal('${o.id}')">🔄 Nachliefern</button>`:''}
          ${(U==='Verwaltung'&&o.typ==='baeko')?`<button class="btn btn-o btn-sm" onclick="event.stopPropagation();openNachzueglerModal('${o.id}')">➕ Nachzügler</button>`:''}
        </div>`:''}

    }).join('');

      ${itemsHTML}
    </div>`;
  }).join('');
}

function ordTbl(o){
  if(!o.positionen||!o.positionen.length)return'';
  const hatAnkunft=o.positionen.some(p=>p.angekommen!==undefined);
  const hatFehl=o.fehlmengen&&Object.keys(o.fehlmengen).length>0;
  return`<div class="twrap"><table><thead><tr>
    <th>Artikel</th><th>Bestellt</th>
    ${hatFehl?'<th>Gepackt</th><th>Fehlt</th>':''}
    ${hatAnkunft?'<th>Angekommen</th><th>Diff</th>':''}
    </tr></thead>
    <tbody>${o.positionen.map(p=>{
      const gepackt=hatFehl&&o.fehlmengen[p.id]!==undefined?(p.menge-(o.fehlmengen[p.id]||0)):null;
      const fehlt=hatFehl&&o.fehlmengen[p.id]>0?o.fehlmengen[p.id]:0;
      const ang=p.angekommen!==undefined?p.angekommen:null;
      const diff=ang!==null?ang-p.menge:null;
      const hasAbw=diff!==null&&diff!==0;
      return`<tr style="${hasAbw?'background:var(--red-lt)':fehlt?'background:var(--amber-lt)':''}">
        <td>${p.name}</td><td>${p.menge}</td>
        ${hatFehl?`<td>${gepackt!==null?gepackt:'–'}</td><td style="color:${fehlt?'var(--red)':'var(--green)'};font-weight:600">${fehlt>0?'−'+fehlt:'✓'}</td>`:''}
        ${hatAnkunft?`<td style="font-weight:${hasAbw?700:400}">${ang!==null?ang:'–'}</td>
          <td style="color:${hasAbw?(diff<0?'var(--red)':'var(--amber)'):'var(--green)'};font-weight:700">
            ${diff!==null?(diff===0?'✓':(diff>0?'+':'')+diff):'–'}
          </td>`:''}
      </tr>`;
    }).join('')}</tbody></table></div>
    ${o.freitext?`<div style="margin-top:8px;padding:8px 10px;background:var(--cream);border-radius:var(--rsm);font-size:12px">📝 Sonstige Artikel: ${o.freitext}</div>`:''}
    ${o.ankunftKommentar?`<div style="margin-top:8px;padding:8px 10px;background:var(--amber-lt);border-radius:var(--rsm);font-size:12px">💬 ${o.ankunftKommentar}</div>`:''}
    ${o.hatAbweichung?`<div class="banner banner-red" style="margin-top:8px">⚠️ Abweichungen bei dieser Lieferung gemeldet</div>`:''}`;
}

function fehlTbl(o){
  const fehler=Object.entries(o.fehlmengen).filter(([k,v])=>v>0);
  if(!fehler.length)return'';
  const hatKritisch=U==='Verwaltung'&&fehler.some(([id,v])=>{const art=(o.positionen||[]).find(p=>p.id===id);return art&&istKritisch(art.name);});
  return`<div class="banner" style="margin-top:10px;background:${hatKritisch?'#7f0000':'var(--red-lt)'};color:${hatKritisch?'white':'var(--red)'};border-color:${hatKritisch?'#7f0000':'var(--red)'}">
    ${hatKritisch?'🚨 <strong>KRITISCHE Fehlmengen!</strong>':'⚠️ Offene Fehlmengen:'} ${fehler.map(([id,v])=>{
    const p=o.positionen.find(x=>x.id===id);return(p?.name||id)+': −'+v;
  }).join(', ')}</div>`;
}
function confirmArr(id){
  const o=db.bestellungen.find(x=>x.id===id);if(!o)return;
  o.status='angekommen';if(!o.statusLog)o.statusLog=[];

function openPackenModal(orderId){
  const o=db.bestellungen.find(x=>x.id===orderId);if(!o)return;
  const nachliefern=o.status==='teilweise';
  let posToShow=nachliefern?o.positionen.filter(p=>o.fehlmengen&&o.fehlmengen[p.id]>0):o.positionen;
  if(nachliefern&&!posToShow.length)posToShow=o.positionen; // Sicherheitsnetz falls fehlmengen fehlt/inkonsistent
  const rows=posToShow.map(p=>{
    const fehlend=o.fehlmengen&&o.fehlmengen[p.id]>0;
    return`<div class="pack-row${fehlend?' fehlend':''}">
      <div><div style="font-weight:500;font-size:13px">${p.name}</div>
        ${fehlend?`<div style="font-size:11px;color:var(--red)">Noch fehlend: ${o.fehlmengen[p.id]}</div>`:''}
      </div>
      <div style="text-align:center;font-size:13px;color:var(--mid)">${p.menge}</div>
      <input class="pack-inp" type="number" min="0" max="${p.menge}" value="${nachliefern?0:(o.fehlmengen&&o.fehlmengen[p.id]!==undefined?p.menge-(o.fehlmengen[p.id]||0):p.menge)}" id="pk-${p.id}" placeholder="${nachliefern?'0':p.menge}">
    </div>`;
  }).join('');
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">${nachliefern?'🔄 Nachliefern':'📦 Packen'} – ${fname(o.filiale)} · ${o.typ==='baeko'?'🌾 BÄKO':'HANDELSWAREN'} · Versand ${o.versanddatum?new Date(o.versanddatum).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}):o.week}</div>
        <div style="display:grid;grid-template-columns:1fr 70px 70px;gap:8px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--light);text-transform:uppercase">
          <div>Artikel</div><div style="text-align:center">Bestellt</div><div style="text-align:center">${nachliefern?'Jetzt gesendet':'Gepackt'}</div>
        </div>
        ${rows}
        <p style="font-size:12px;color:var(--light);margin-top:10px">${nachliefern?'Nur noch fehlende Artikel. Menge eintragen, die jetzt nachgeschickt wird.':'Gepackte Menge eintragen. Fehlmengen bleiben als offene Position bestehen.'}</p>
        <div class="brow" style="margin-top:14px">
          <button class="btn btn-p" onclick="submitPacken('${orderId}')">✅ Versand bestätigen</button>
          <button class="btn btn-o" onclick="closeModal()">Abbrechen</button>
        </div>
      </div>
    </div>`;
}
function closeModal(){document.getElementById('modal-container').innerHTML='';}
function submitPacken(orderId){
  const o=db.bestellungen.find(x=>x.id===orderId);if(!o)return;
  const nachliefern=o.status==='teilweise';
  const fehlmengen={};let hatFehler=false;const nachgeliefert=[];
  o.positionen.forEach(p=>{
    const el=document.getElementById('pk-'+p.id);
    if(nachliefern){
      const vorherFehlt=(o.fehlmengen&&o.fehlmengen[p.id])||0;
      if(!el){ // nicht angezeigt = war schon vollständig gepackt
        fehlmengen[p.id]=vorherFehlt>0?vorherFehlt:0;
        if(fehlmengen[p.id]>0)hatFehler=true;
        return;
      }
      const jetztGesendet=Math.max(0,parseFloat(el.value)||0);
      const restFehlt=Math.max(0,vorherFehlt-jetztGesendet);
      fehlmengen[p.id]=restFehlt;
      if(restFehlt>0)hatFehler=true;
      if(jetztGesendet>0)nachgeliefert.push({id:p.id,menge:jetztGesendet});
    }else{
      const gepackt=el?parseFloat(el.value)||0:p.menge;
      const fehlt=Math.max(0,p.menge-gepackt);
      if(fehlt>0){fehlmengen[p.id]=fehlt;hatFehler=true;}
      else fehlmengen[p.id]=0;
    }
  });
  o.fehlmengen=fehlmengen;
  o.status=hatFehler?'teilweise':'versendet';
  if(!o.statusLog)o.statusLog=[];
  o.statusLog.push({status:o.status,datum:new Date().toISOString(),by:U,
    note:nachliefern
      ? (hatFehler?'Nachlieferung – weiterhin Fehlmengen offen':'Nachlieferung – jetzt vollständig')
      : (hatFehler?'Teilweise versendet – Fehlmengen offen':'Vollständig versendet')});
  // Lagerbestand automatisch reduzieren
  if(o.typ==='metro'&&db.lager){
    if(nachliefern){
      nachgeliefert.forEach(n=>{
        if(db.lager[n.id]!==undefined){
          db.lager[n.id].menge=Math.max(0,(db.lager[n.id].menge||0)-n.menge);
        }
      });
    }else{
      o.positionen.forEach(p=>{
        const gepackt=p.menge-(fehlmengen[p.id]||0);
        if(gepackt>0&&db.lager[p.id]!==undefined){
          db.lager[p.id].menge=Math.max(0,(db.lager[p.id].menge||0)-gepackt);
        }
      });
    }
  }
  save();closeModal();
  if(hatFehler){
    const fehlerListe=Object.entries(fehlmengen).filter(([k,v])=>v>0)
      .map(([id,v])=>{const p=o.positionen.find(x=>x.id===id);return(p?.name||id)+': −'+v;}).join(', ');
    toast('⚠️ Teilweise versendet. Fehlmengen: '+fehlerListe);
  }else toast('✅ Vollständig versendet!');
  renderVwBest();updateStartBanner();
}

function finalisiereAlteTeilweise(){
  const cutoff=document.getElementById('teilw-cutoff')?.value;
  if(!cutoff){toast('Bitte Datum wählen.');return;}
  const betroffene=db.bestellungen.filter(b=>(b.typ==='metro'||b.typ==='baeko')&&b.status==='teilweise'&&(b.datum||'').slice(0,10)<cutoff);
  if(!betroffene.length){toast('Keine alten Teilweise-Bestellungen vor diesem Datum.');return;}
  const cutoffLbl=new Date(cutoff+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  if(!confirm(`${betroffene.length} Teilweise-Bestellung(en) vor dem ${cutoffLbl} als "Bestätigt" abschließen? Fehlmengen werden nicht mehr nachgeliefert, bleiben aber in der Historie sichtbar.`))return;
  betroffene.forEach(b=>{
    b.status='bestaetigt';
    if(!b.statusLog)b.statusLog=[];
    b.statusLog.push({status:'bestaetigt',datum:new Date().toISOString(),by:U,note:'Nicht nachgeliefert – als Altbestand abgeschlossen'});
  });
  save();
  toast(`✅ ${betroffene.length} alte Teilweise-Bestellung(en) abgeschlossen`);
  refVwB();
  if(typeof renderStart==='function')renderStart();
  if(document.getElementById('vw-matrix-table'))renderVwMatrix();
}

function refreshNachzArtikel(){
  const fil=document.getElementById('nz-fil')?.value;
  const sel=document.getElementById('nz-art');if(!sel)return;
  const arts=BAEKO[fil]||[];
  sel.innerHTML=arts.length
    ?`<option value="">– wählen –</option>${arts.map(a=>`<option value="${a.id}">${a.name} (${a.id})</option>`).join('')}`
    :`<option value="">Keine Artikel für diese Filiale gefunden</option>`;

function submitNachzuegler(wMo,orderId){
  const fil=document.getElementById('nz-fil')?.value;
  const name=document.getElementById('nz-name')?.value.trim();
  const menge=parseFloat(document.getElementById('nz-menge')?.value)||0;
  const freiName=document.getElementById('nz-frei-name')?.value.trim();
  const artId=document.getElementById('nz-art')?.value;
  if(!fil){toast('Bitte Filiale wählen.');return;}
  if(!name){toast('Bitte Namen eintragen.');return;}
  if(menge<=0){toast('Bitte Menge eingeben.');return;}
  let artName,artArtId;
  if(freiName){artArtId='frei_'+Date.now();artName=freiName;}
  else if(artId){const art=(BAEKO[fil]||[]).find(a=>a.id===artId);if(!art){toast('Artikel nicht gefunden.');return;}artArtId=art.id;artName=art.name;}
  else{toast('Bitte Artikel wählen oder Freitext eintragen.');return;}

  let o=orderId?db.bestellungen.find(x=>x.id===orderId):db.bestellungen.find(b=>b.typ==='baeko'&&b.filiale===fil&&(b.wocheMo===wMo||b.week===wMo));
  if(o){
    const bestehend=o.positionen.find(p=>p.id===artArtId);
    if(bestehend)bestehend.menge+=menge;
    else o.positionen.push({id:artArtId,name:artName,menge});
    if(!o.statusLog)o.statusLog=[];
    o.statusLog.push({status:o.status,datum:new Date().toISOString(),by:name,note:`Nachzügler: ${artName} +${menge}`});
  }else{
    o={
      id:'ord_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      typ:'baeko',filiale:fil,wocheMo:wMo,week:wMo,
      wocheLabel:new Date(wMo+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}),
      datum:new Date().toISOString(),status:'bestaetigt',nachzuegler:true,
      positionen:[{id:artArtId,name:artName,menge}],
      statusLog:[{status:'bestaetigt',datum:new Date().toISOString(),by:name,note:'Als Nachzügler angelegt'}]
    };
    db.bestellungen.push(o);
  }
  save();closeModal();
  toast(`✅ ${artName} (${menge}) zu ${fname(fil)} hinzugefügt`);
  refVwB();refreshHist();
}
function vwDefaultOffset(){
  // Do=4, Fr=5, Sa=6, Mo=1 → Bestellphase für nächste Woche → +1
  const dow=(new Date().getDay()||7);
  return (dow>=4||dow===1)?1:0;
}
function vwMatrixShift(dir){
  if(dir===0)window._vwWeekOffset=vwDefaultOffset();
  else window._vwWeekOffset=(window._vwWeekOffset||0)+dir;
  renderVwMatrix();
}

function renderVwMatrix(){
  const off=window._vwWeekOffset||0;
  const now=new Date();const dow=now.getDay()||7;
  const mo=new Date(now);mo.setDate(now.getDate()-(dow-1)+(off*7));mo.setHours(0,0,0,0);
  const fr=new Date(mo);fr.setDate(mo.getDate()+4);
  const moISO=localISO(mo);
  const frISO=localISO(fr);
  const kwLabel='KW '+mo.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+' – '+fr.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
  const title=document.getElementById('vw-matrix-title');if(title)title.textContent=kwLabel;
  const typen=[{id:'baeko',lbl:'BÄKO'},{id:'metro',lbl:'HW'},{id:'reinigung',lbl:'Reinigung'}];
  const stDot=s=>{
    if(!s)return`<div style="width:22px;height:22px;border-radius:50%;background:var(--cream);display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:var(--light)">–</div>`;
    const cfg={offen:{bg:'#FAEEDA',c:'#633806',t:'O'},teilweise:{bg:'#FAEEDA',c:'#633806',t:'T'},versendet:{bg:'#E6F1FB',c:'#0C447C',t:'V'},angekommen:{bg:'#EAF3DE',c:'#27500A',t:'A'},bestaetigt:{bg:'#E1F5EE',c:'#085041',t:'✓'}}[s]||{bg:'var(--cream)',c:'var(--light)',t:'?'};
    return`<div style="width:22px;height:22px;border-radius:50%;background:${cfg.bg};color:${cfg.c};display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700">${cfg.t}</div>`;
  };
  const rows=ALLE_FIL.map(fil=>{
    const cells=typen.map(typ=>{
      if(typ.id==='reinigung'){
        const best=(db.reinigung||[]).find(r=>r.filiale===fil&&r.datum?.slice(0,10)>=moISO&&r.datum?.slice(0,10)<=frISO);
        return`<td style="text-align:center;padding:5px 4px;border-bottom:.5px solid var(--border)">${best?stDot('bestaetigt'):stDot(null)}</td>`;
      }
      const best=db.bestellungen.find(b=>b.filiale===fil&&b.typ===typ.id&&(b.wocheMo===moISO||b.versanddatum===frISO||b.versanddatum===moISO||(b.wocheMo>=moISO&&b.wocheMo<=frISO)));
      return`<td style="text-align:center;padding:5px 4px;border-bottom:.5px solid var(--border)">${stDot(best?.status||null)}</td>`;
    }).join('');
    return`<tr><td style="padding:5px 0;border-bottom:.5px solid var(--border);font-size:12px;font-weight:500">${fil}</td>${cells}</tr>`;
  }).join('');
  const legend=[{bg:'#FAEEDA',c:'#633806',t:'O · Offen'},{bg:'#E6F1FB',c:'#0C447C',t:'V · Versendet'},{bg:'#EAF3DE',c:'#27500A',t:'A · Angekommen'},{bg:'#E1F5EE',c:'#085041',t:'✓ · Bestätigt'}];
  const tbl=document.getElementById('vw-matrix-table');if(!tbl)return;
  tbl.innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead><tr>
      <th style="text-align:left;font-size:10px;font-weight:600;color:var(--light);text-transform:uppercase;padding:4px 0;border-bottom:.5px solid var(--border)">Filiale</th>
      ${typen.map(t=>`<th style="text-align:center;font-size:10px;font-weight:600;color:var(--light);text-transform:uppercase;padding:4px;border-bottom:.5px solid var(--border)">${t.lbl}</th>`).join('')}
    </tr></thead><tbody>${rows}</tbody></table>
  <div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap">
    ${legend.map(l=>`<span style="font-size:11px;color:var(--mid);display:flex;align-items:center;gap:4px"><span style="width:16px;height:16px;border-radius:50%;background:${l.bg};color:${l.c};display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700">${l.t[0]}</span>${l.t.slice(4)}</span>`).join('')}
    <span style="font-size:11px;color:var(--mid);display:flex;align-items:center;gap:4px"><span style="width:16px;height:16px;border-radius:50%;background:var(--cream);display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:var(--light)">–</span>Keine</span>
  </div>`;
}

              onclick="event.stopPropagation();deleteOrder('${o.id}')">🗑️ Löschen</button>`:''}
          </div>

    }).join('');

    return`<div style="margin-bottom:18px">

function submitHwEdit(orderId){
  const o=db.bestellungen.find(x=>x.id===orderId);if(!o)return;
  const name=document.getElementById('hwe-name')?.value.trim();
  if(!name){toast('Bitte Namen eintragen.');return;}
  const neuePos=[];
  o.positionen.forEach(p=>{

  o.geaendertVon=name+' ('+new Date().toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})+')';

function pFoot(){
  return`</body></html>`;
}
function openPrint(html){
  const w=window.open('','_blank','width=800,height=600');
  if(!w){
    const blob=new Blob([html],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    window.open(url,'_blank');
    return;
  }
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(()=>{w.print();},400);
}

function printBaeko(){
  const wMo=document.getElementById('pdf-woche')?.value||nextWeekMoISO();
  // Bestellungen dieser Woche finden – Vergleich auf wocheMo oder week (beide = Montag-ISO)
  const orders=db.bestellungen.filter(b=>b.typ==='baeko'&&(b.wocheMo===wMo||b.week===wMo));
  if(!orders.length){toast('Keine Bäko-Bestellungen für diese Woche.');return;}

  const {jsPDF}=window.jspdf;
  if(!jsPDF){toast('PDF-Bibliothek noch nicht geladen – bitte kurz warten.');return;}

  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const wLabel=orders[0]?.wocheLabel||w;
  const datum=new Date().toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});

  // Header
  doc.setFontSize(16);doc.setFont('helvetica','bold');
  doc.text('Bäcker Bock – BÄKO-Bestellung',14,18);
  doc.setFontSize(10);doc.setFont('helvetica','normal');
  doc.text(`Woche: ${wLabel}   ·   Erstellt: ${datum} von ${U}`,14,25);
  doc.line(14,28,196,28);

  let y=35;
  orders.forEach(o=>{
    if(y>260){doc.addPage();y=20;}
    doc.setFontSize(11);doc.setFont('helvetica','bold');
    doc.text(fname(o.filiale),14,y);
    const adr=FILIAL_ADR[o.filiale];
    if(adr){doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(100);doc.text(adr,14,y+5);doc.setTextColor(0);y+=4;}
    y+=2;
    doc.autoTable({
      startY:y,
      head:[['Art.-Nr.','Artikel','Menge']],
      body:o.positionen.map(p=>[p.id,p.name,String(p.menge)]),
      styles:{fontSize:9,cellPadding:2},
      headStyles:{fillColor:[10,10,10],textColor:255,fontStyle:'bold'},
      columnStyles:{0:{cellWidth:28},2:{cellWidth:18,halign:'center'}},
      margin:{left:14,right:14},
      theme:'grid',
    });
    y=doc.lastAutoTable.finalY+8;
  });

  // Unterschrift
  if(y>250){doc.addPage();y=20;}
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('Unterschrift: ___________________________',14,y+10);

  // PDF herunterladen
  const filename=`Baeko_${wLabel.replace(/[^0-9.]/g,'_')}.pdf`;
  doc.save(filename);

  // mailto öffnen
  const betreff=encodeURIComponent(`BÄKO-Bestellung Woche ${wLabel}`);
  const body=encodeURIComponent(`Hallo,\n\nanbei die BÄKO-Bestellung für die Woche ${wLabel}.\n\nFreundliche Grüße\nBäcker Bock`);
  setTimeout(()=>{
    window.location.href=`mailto:Michaela.Lauer@baeko-franken.de?subject=${betreff}&body=${body}`;
  },800);

  // Status automatisch auf "Versendet" setzen (nur die noch offenen — bereits teilweise/versendete
  // Bestellungen bleiben unangetastet, damit dort keine Fehlmengen überschrieben werden).
  const versendet=orders.filter(o=>o.status==='offen');
  versendet.forEach(o=>{
    o.status='versendet';
    if(!o.statusLog)o.statusLog=[];
    o.statusLog.push({status:'versendet',datum:new Date().toISOString(),by:U,note:'BÄKO-Sammel-PDF erzeugt & Mail geöffnet'});
  });
  if(versendet.length){
    save();
    if(document.getElementById('vblist'))refVwB();
    if(document.getElementById('vw-matrix-table'))renderVwMatrix();
  }

  toast(`✅ PDF heruntergeladen – Mail-Client wird geöffnet.${versendet.length?` ${versendet.length} Bestellung(en) auf "Versendet" gesetzt.`:''}`);
}

// ═══════════════════ KÜHLPLÄNE ═══════════════════
// Struktur: db.kuehltheke[key] = { messungen: [{zeit, temp, name, geraet}], ... }
// Eine Kühltheke + ein Kühlschrank + eine Sahnemaschine pro Filiale
// Frühschicht 06-12: Kühltheke 10+12, Kühlschrank 08, Sahnemaschine 08
// Spätschicht 12-18: Kühltheke 16, Kühlschrank 16, Sahnemaschine 16

const KUEHL_ITEMS = [
  {id:'kt', name:'Kühltheke', zeiten_frueh:['10:00','12:00'], zeiten_spaet:['16:00']},
  {id:'ks', name:'Kühlschrank', zeiten_frueh:['08:00'], zeiten_spaet:['16:00']},
  {id:'sm', name:'Sahnemaschine', zeiten_frueh:['08:00'], zeiten_spaet:['16:00']},
];

const SCHICHTEN = [
  {id:'frueh', name:'Frühschicht', von:'06:00', bis:'12:00', zeiten:['08:00','10:00','12:00']},
  {id:'spaet', name:'Spätschicht', von:'12:00', bis:'18:00', zeiten:['12:00','16:00']},
];

function getAktuelleSchicht(){
  const h=new Date().getHours();
  if(h>=6&&h<12) return 'frueh';
  if(h>=12&&h<18) return 'spaet';
  return null;
}

function kuehlKey(fil,datum,schicht){return `${fil}_${datum}_${schicht}`;}

function renderKuehltheke(){
  const mc=document.getElementById('mc');
  const datum=today();
  const schicht=getAktuelleSchicht();
  const schichtObj=schicht?SCHICHTEN.find(s=>s.id===schicht):null;
  if(!db.kuehltheke)db.kuehltheke={};
  const key=kuehlKey(U,datum,schicht||'manual');
  if(!db.kuehltheke[key])db.kuehltheke[key]={messungen:{}};
  const eintrag=db.kuehltheke[key];

  const schichtBanner=schicht?
    `<div class="banner banner-info">🕐 ${schichtObj.name} (${schichtObj.von}–${schichtObj.bis}) · ${new Date().toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}</div>`:
    `<div class="banner banner-warn">⚠️ Aktuell keine aktive Schicht. Manuelle Eingabe möglich.</div>`;

  // Baue Messfelder: pro Gerät + Zeit = Temp-Feld + Name-Feld
  const rows=KUEHL_ITEMS.map(item=>{
    const zeiten=schicht==='frueh'?item.zeiten_frueh:schicht==='spaet'?item.zeiten_spaet:[...item.zeiten_frueh,...item.zeiten_spaet];
    return `<div style="background:var(--bg);border:1.5px solid var(--border);border-radius:var(--rsm);padding:14px;margin-bottom:10px">
      <div style="font-weight:600;font-size:14px;margin-bottom:12px">${item.name}</div>
      ${zeiten.map(zeit=>{
        const mKey=item.id+'_'+zeit;
        const m=eintrag.messungen[mKey]||{temp:'',name:''};
        const done=m.temp!==''&&m.name!=='';
        return `<div style="display:grid;grid-template-columns:80px 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px;padding:8px;background:${done?'var(--green-lt)':'white'};border-radius:var(--rsm);border:1.5px solid ${done?'var(--green)':'var(--border)'}">
          <div style="font-weight:600;font-size:13px;text-align:center">${zeit}</div>
          <div>
            <div class="flbl" style="margin-bottom:3px">Temperatur</div>
            <input type="number" step="0.1" value="${m.temp}"
              placeholder="°C"
              style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:14px;font-family:'Inter',sans-serif;text-align:center"
              oninput="saveMessung('${key}','${mKey}','temp',this.value)">
          </div>
          <div>
            <div class="flbl" style="margin-bottom:3px">Name</div>
            <input type="text" value="${m.name}"
              placeholder="Wer hat gemessen?"
              style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:14px;font-family:'Inter',sans-serif"
              oninput="saveMessung('${key}','${mKey}','name',this.value)">
          </div>
          <div style="font-size:20px;margin-top:18px">${done?'✅':'○'}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  // Prüfe ob alle Felder ausgefüllt
  const allZeiten=KUEHL_ITEMS.flatMap(item=>
    (schicht==='frueh'?item.zeiten_frueh:schicht==='spaet'?item.zeiten_spaet:[...item.zeiten_frueh,...item.zeiten_spaet])
    .map(z=>item.id+'_'+z)
  );
  const alleAusgefuellt=allZeiten.every(k=>{const m=eintrag.messungen[k];return m&&m.temp!==''&&m.name!=='';});
  const istAbgeschlossen=eintrag.abgeschlossen||false;

  mc.innerHTML=`<div class="card">
    <div class="ctitle">🌡️ KÜHLPLÄNE</div>
    ${schichtBanner}
    ${istAbgeschlossen?`<div class="banner banner-ok">✅ Schicht abgeschlossen um ${eintrag.zeitpunkt?new Date(eintrag.zeitpunkt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''} Uhr</div>`:''}
    ${rows}
    <div class="brow">
      ${!istAbgeschlossen&&alleAusgefuellt?`<button class="btn btn-p" onclick="abschliessenKuehl('${key}')">✅ Schicht abschließen</button>`:''}

function saveMessung(key,mKey,field,val){
  if(!db.kuehltheke)db.kuehltheke={};
  if(!db.kuehltheke[key])db.kuehltheke[key]={messungen:{}};
  if(!db.kuehltheke[key].messungen[mKey])db.kuehltheke[key].messungen[mKey]={temp:'',name:''};
  db.kuehltheke[key].messungen[mKey][field]=val;
  saveKuehlDB();
  // Live-Update Checkbox
  const allZeiten=KUEHL_ITEMS.flatMap(item=>{
    const schicht=getAktuelleSchicht();
    return(schicht==='frueh'?item.zeiten_frueh:schicht==='spaet'?item.zeiten_spaet:[...item.zeiten_frueh,...item.zeiten_spaet]).map(z=>item.id+'_'+z);
  });
  const alleAusgefuellt=allZeiten.every(k=>{const m=db.kuehltheke[key].messungen[k];return m&&m.temp!==''&&m.name!=='';});
}

function abschliessenKuehl(key){
  if(!db.kuehltheke[key])return;
  db.kuehltheke[key].abgeschlossen=true;
  db.kuehltheke[key].zeitpunkt=new Date().toISOString();
  saveKuehlDB();toast('✅ Schicht abgeschlossen.');renderKuehltheke();updateStartBanner();
}
function saveKuehlDB(){
  if(fbReady&&fbRef){
    fbRef.child('kuehltheke').set(db.kuehltheke).catch(e=>console.error(e));
  }else{
    try{localStorage.setItem('bock_db',JSON.stringify(db));}catch{}
  }
}

function printKuehl(key,datum,schicht){
  const e=db.kuehltheke?db.kuehltheke[key]:null;

const PUTZ_TAEGLICH = ['Preisschilder gereinigt','Mikrowelle gereinigt'];
const PUTZ_WOECHENTLICH = ['Brotregal feucht gewischt','Besteckkörbe reinigen','Ablagefächer Theke reinigen',
  'Ablagefächer Küche reinigen','Preisstchilderschiene Theke aussaugen','Sitzflächen reinigen',

  'Aufsteller gereinigt','Kühlzüge gereinigt','Kühlschränke gereinigt'];
const PUTZ_MONATLICH = ['Hinter Heizkörper reinigen','Lampen reinigen'];

function renderPutzplan(){
  const mc=document.getElementById('mc');
  if(!db.putzplan)db.putzplan={};
  const monat=today().slice(0,7);
  const datum=today();
  const daysInMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  const today_day=parseInt(datum.slice(8));

  // Wochentag-Header (Mo Di Mi Do Fr Sa So)
  const wochentage=['Mo','Di','Mi','Do','Fr','Sa','So'];
  // Erster Tag des Monats
  const firstDow=new Date(monat+'-01').getDay(); // 0=So
  const firstMon=(firstDow===0?6:firstDow-1); // 0=Mo

  const dayHeader=Array.from({length:daysInMonth},(_,i)=>{
    const d=i+1;
    const dow=(firstMon+i)%7;
    const isToday=d===today_day;
    const isWE=dow>=5;
    return`<th style="font-size:9px;padding:3px 1px;text-align:center;min-width:26px;
      ${isToday?'background:var(--black);color:white;border-radius:3px':''}
      ${isWE&&!isToday?'color:var(--light)':''}">
      <div>${wochentage[dow]}</div><div>${d}</div>
    </th>`;
  }).join('');

  const makeSection=(titel,items,typ,emoji)=>{
    const rows=items.map(item=>{
      const iKey=`${U}_${monat}_${item}`;
      const checks=db.putzplan[iKey]||{};
      if(typ==='taeglich'){
        const done=checks[datum]||false;
        return`<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;
          background:${done?'var(--green-lt)':'white'};border-radius:var(--rsm);
          border:1.5px solid ${done?'var(--green)':'var(--border)'};margin-bottom:6px">
          <input type="checkbox" style="width:22px;height:22px;flex-shrink:0;cursor:pointer;accent-color:var(--black)"
            ${done?'checked':''} onchange="togglePutz('${iKey}','${datum}',this.checked)">
          <span style="font-size:13px;${done?'text-decoration:line-through;color:var(--light)':''}">${item}</span>
          ${done?'<span style="margin-left:auto;font-size:12px;color:var(--green)">✓ Erledigt</span>':''}
        </div>`;
      }else{
        const cols=Array.from({length:daysInMonth},(_, i)=>{
          const d=String(i+1).padStart(2,'0');
          const dStr=`${monat}-${d}`;
          const done=checks[dStr]||false;
          const isToday=dStr===datum;
          const dow=(firstMon+i)%7;
          const isWE=dow>=5;
          return`<td style="text-align:center;padding:2px;background:${isToday?'#f5f5f5':isWE?'#fafafa':''}">
            <input type="checkbox" style="width:16px;height:16px;cursor:pointer;accent-color:var(--black)"
              ${done?'checked':''} onchange="togglePutz('${iKey}','${dStr}',this.checked)">
          </td>`;
        }).join('');
        const doneCount=Object.values(checks).filter(Boolean).length;
        return`<tr>
          <td style="font-size:12px;padding:6px 12px;white-space:nowrap;min-width:200px">
            ${item}
            ${doneCount?`<span style="font-size:10px;color:var(--green);margin-left:6px">(${doneCount}×)</span>`:''}
          </td>${cols}
        </tr>`;
      }
    }).join('');

    if(typ==='taeglich'){
      const doneAll=items.every(item=>(db.putzplan[`${U}_${monat}_${item}`]||{})[datum]);
      return`<div class="card" style="margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <span style="font-size:18px">${emoji}</span>
          <span style="font-weight:700;font-size:14px">${titel}</span>
          ${doneAll?`<span class="st st-bestaetigt" style="margin-left:auto">✅ Alles erledigt</span>`:''}
        </div>
        ${rows}
      </div>`;
    }else{
      return`<div class="card" style="margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <span style="font-size:18px">${emoji}</span>
          <span style="font-weight:700;font-size:14px">${titel}</span>
          <span style="font-size:11px;color:var(--light);margin-left:6px">${new Date(monat+'-01').toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</span>
        </div>
        <div class="twrap"><table style="font-size:12px;width:100%">
          <thead><tr><th style="text-align:left;padding:4px 12px;min-width:200px">Aufgabe</th>${dayHeader}</tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>`;
    }
  };

  mc.innerHTML=`<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="font-weight:700;font-size:15px">🧹 Putzplan · ${fname(U)}</div>
      ${U==='Verwaltung'?`<button class="btn btn-o btn-sm no-print" onclick="window.print()">🖨️ Drucken</button>`:''}
    </div>
    ${makeSection('Täglich',PUTZ_TAEGLICH,'taeglich','📋')}
    ${makeSection('Wöchentliche Aufgaben',PUTZ_WOECHENTLICH,'monatlich','🔄')}
    ${makeSection('Monatliche Aufgaben',PUTZ_MONATLICH,'monatlich','📅')}
  </div>`;
}

        </div>
        <div class="brow" style="margin-top:14px">
          <button class="btn btn-p" onclick="submitAngekommen('${orderId}')">✅ Lieferung bestätigen</button>
          <button class="btn btn-o" onclick="closeModal()">Abbrechen</button>
        </div>
      </div>
    </div>`;

function submitAngekommen(orderId){
  const o=db.bestellungen.find(x=>x.id===orderId);if(!o)return;
  const kommentar=document.getElementById('ang-kommentar')?.value.trim()||'';
  const abweichungen=[];
  o.positionen.forEach(p=>{
    const el=document.getElementById('ang-'+p.id);
    const angekommen=el?parseFloat(el.value)||0:p.menge;
    const diff=angekommen-p.menge;
    if(diff!==0){
      abweichungen.push({id:p.id,name:p.name,bestellt:p.menge,angekommen,diff});
    }
    p.angekommen=angekommen;
  });
  o.abweichungen=abweichungen;
  o.ankunftKommentar=kommentar;
  o.hatAbweichung=abweichungen.length>0||kommentar!=='';
  const fehlt=abweichungen.filter(a=>a.diff<0);
  if(fehlt.length){
    if(!o.fehlmengen)o.fehlmengen={};
    fehlt.forEach(a=>{o.fehlmengen[a.id]=-a.diff;});
    o.status='teilweise';
  }else{
    o.status='angekommen';
  }
  if(!o.statusLog)o.statusLog=[];
  o.statusLog.push({
    status:o.status,datum:new Date().toISOString(),by:U,
    note: abweichungen.length>0
      ? `⚠️ Abweichungen gemeldet: ${abweichungen.map(a=>`${a.name}: ${a.bestellt}→${a.angekommen}`).join(', ')}`
      : kommentar||'Vollständig angekommen'
  });
  save();closeModal();
  if(fehlt.length){
    toast(`⚠️ Fehlmenge gemeldet – ${fname(o.filiale)} wartet auf Nachlieferung`);
  }else if(abweichungen.length>0||kommentar){
    toast(`📬 Bestätigt – ${abweichungen.length} Abweichung(en) gemeldet`);
  }else{
    toast('📬 Lieferung vollständig bestätigt!');
  }
  refreshHist();updateStartBanner();
}
