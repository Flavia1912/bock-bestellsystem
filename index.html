function removeBaekoEditPos(posId){
  const row=document.getElementById('be-'+posId)?.closest('.pack-row');
  if(row)row.remove();
}

function addBaekoEditPos(orderId){
  const sel=document.getElementById('be-add-sel');
  const id=sel?.value;if(!id)return;
  const menge=parseFloat(document.getElementById('be-add-menge')?.value)||1;
  const o=db.bestellungen.find(x=>x.id===orderId);if(!o)return;
  const fil=o.filiale;
  const art=(BAEKO[fil]||[]).find(a=>a.id===id);if(!art)return;
  const rows=document.getElementById('be-rows');
  if(rows){
    rows.innerHTML+=`<div class="pack-row" style="grid-template-columns:1fr 80px 28px;margin-bottom:5px">
      <div style="font-size:13px;font-weight:500">${art.name}<br>
        <span style="font-size:11px;color:var(--light)">${art.id}</span></div>
      <input class="pack-inp" type="number" min="0" value="${menge}" id="be-${art.id}" placeholder="0">
      <button style="background:none;border:none;color:var(--light);cursor:pointer;font-size:16px;padding:0"
        onclick="removeBaekoEditPos('${art.id}')">✕</button>
    </div>`;
  }
  // Remove from dropdown
  sel.querySelector(`option[value="${id}"]`)?.remove();
  sel.value='';
}

function submitBaekoEdit(orderId){
  const o=db.bestellungen.find(x=>x.id===orderId);if(!o)return;
  const name=document.getElementById('be-name')?.value.trim();
  if(!name){toast('Bitte Namen eintragen.');return;}
  const fil=o.filiale;
  const alleArts=BAEKO[fil]||[];
  const aenderungen=[];
  // Neue Positionen aus Modal lesen
  const neuePos=[];
  // Bestehende Positionen
  o.positionen.forEach(p=>{
    const el=document.getElementById('be-'+p.id);
    if(!el)return; // wurde entfernt
    const nm=parseFloat(el.value)||0;
    if(nm>0){
      if(nm!==p.menge)aenderungen.push(`${p.name}: ${p.menge}→${nm}`);
      neuePos.push({...p,menge:nm});
    }else{
      aenderungen.push(`${p.name}: entfernt`);
    }
  });
  // Neu hinzugefügte Artikel
  alleArts.forEach(a=>{
    if(o.positionen.find(p=>p.id===a.id))return; // bereits vorhanden
    const el=document.getElementById('be-'+a.id);
    if(!el)return;
    const nm=parseFloat(el.value)||0;
    if(nm>0){
      neuePos.push({id:a.id,name:a.name,menge:nm});
      aenderungen.push(`${a.name}: neu +${nm}`);
    }
  });
  o.positionen=neuePos;
  if(!o.statusLog)o.statusLog=[];
  o.statusLog.push({
    status:o.status,datum:new Date().toISOString(),by:name,
    note:`Bearbeitet: ${aenderungen.length?aenderungen.join(', '):'keine Änderung'}`
  });
  save();closeModal();
  toast(`✅ Bestellung bearbeitet von ${name}`);
  refVwB();
}

function changeArtId(typ,fil,idx,newId){
  if(typ==='baeko'){if(BAEKO[fil]&&BAEKO[fil][idx])BAEKO[fil][idx].id=newId.trim();}
  else{if(METRO[fil]&&METRO[fil][idx])METRO[fil][idx].id=newId.trim();}
  showSaveBar();
}
function changeBaekoKat(fil,idx,newKat){
  if(!BAEKO[fil]||!BAEKO[fil][idx])return;
  BAEKO[fil][idx].kat=newKat;showSaveBar();
}
function changeMetroKat(fil,idx,newKat){
  if(!METRO[fil]||!METRO[fil][idx])return;
  METRO[fil][idx].kat=newKat;showSaveBar();
}

function changeLager(id, delta){
  if(!db.lager[id])db.lager[id]={menge:0,min:LAGER_ART.find(a=>a.id===id)?.min||0};
  const art=LAGER_ART.find(a=>a.id===id);
  db.lager[id].menge=Math.max(0,(db.lager[id].menge||0)+delta);
  // Log
  if(!db.lagerLog)db.lagerLog=[];
  db.lagerLog.push({datum:new Date().toISOString(),id,name:art?.name||id,delta,unit:art?.unit||'',by:U});
  const el=document.getElementById('lm-'+id);
  if(el)el.textContent=db.lager[id].menge;
  const low=db.lager[id].menge<=(db.lager[id].min||art?.min||0);
  const row=el?.closest('.orow');
  if(row){const nm=row.querySelector('.aname');if(nm){nm.style.color=low?'var(--red)':'';nm.textContent=(art?.name||id)+(low?' ⚠️':'');}}
}

function submitAnfangsbestand(){
  let count=0;
  LAGER_ART.forEach(a=>{
    const el=document.getElementById('ab-'+a.id);
    const v=parseFloat(el?.value);
    if(!isNaN(v)&&v>=0){
      if(!db.lager[a.id])db.lager[a.id]={menge:0,min:a.min};
      const alt=db.lager[a.id].menge||0;
      db.lager[a.id].menge=v;
      if(!db.lagerLog)db.lagerLog=[];
      db.lagerLog.push({datum:new Date().toISOString(),id:a.id,name:a.name,delta:v-alt,unit:a.unit||'',by:U,typ:'anfangsbestand'});
      count++;
    }
  });
  save();closeModal();toast(`✅ Anfangsbestand für ${count} Artikel gesetzt.`);renderLager();

// ═══════════════════ INVENTUR: Berechnungslogik ═══════════════════
function aktuelleMonatKey(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function monatLabel(monatKey){
  const[j,m]=monatKey.split('-');
  return new Date(j,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});
}
// ═══ Inventur-Katalog: ergibt sich automatisch aus den BÄKO- und HW-Artikellisten der Filiale ═══
// (keine separat gepflegte Artikelliste mehr — was bestellbar ist, ist auch zählbar)
// Referenz-Wörterbuch (Name→Zusatzinfo) für die 11 "festgelegten" Artikel mit Kassen-/Rezeptabgleich,
// plus Alias-Tabelle für Namensabweichungen zwischen altem Excel-Import und Live-Artikelname.
const INVENTUR_ARTIKEL_BY_ID=Object.fromEntries(INVENTUR_ARTIKEL.map(a=>[a.id,a]));
const INVENTUR_ARTIKEL_BY_NAME=Object.fromEntries(INVENTUR_ARTIKEL.map(a=>[a.name,a]));
const INVENTUR_NAMENS_ALIAS={
  'Coca-Cola':'inv_cola','Coca-Cola light':'inv_colalight','Cola/Cola Zero':'inv_colazero',
  'Markenbutter 250gr.':'inv_markenbutter','Kaba nachfüller':'inv_kaba',
  'vio Mineralwasser spritzig':'inv_vio','vio Mineralwasser still':'inv_vio',
  // — alte/technische Namen aus dem Sheet, die jetzt einen freundlicheren Anzeigenamen haben —
  'Pfefferminze':'inv_pfefferminze','Lactosefreie Milch 3,8%':'inv_lactosefreie_milch',
  'Pappteller 11 x 17,5 cm':'inv_pappteller_11_x_17_5_cm','Pappteller 16 x 20 cm':'inv_pappteller_16_x_20_cm',
  'Pappteller 21 x 30 cm':'inv_pappteller_21_x_30_cm',
  'M23 Tüten':'inv_m23_tueten','FD 618 Tüten':'inv_fd_618_tueten','FD622 Tüten':'inv_fd622_tueten',
  'Konditorseide 50cm.':'inv_konditorseide_50cm',
};
// Artikel, die zwar im BÄKO-/HW-Bestand existieren können, aber bewusst nicht in der Inventur
// gezählt werden sollen (auf Wunsch aus der Liste genommen).
function normName(s){return(s||'').toLowerCase().replace(/[^a-z0-9äöüß]/g,'');}
const INVENTUR_AUSSCHLUSS=new Set(['recupbecher','recupdeckel','bowlschale','salatdressing','semmelbrösel','knödelbrot'].map(normName));
const INVENTUR_ARTIKEL_BY_NORM=(()=>{
  const m={};
  INVENTUR_ARTIKEL.forEach(a=>{m[normName(a.name)]=a;});
  Object.entries(INVENTUR_NAMENS_ALIAS).forEach(([name,id])=>{
    const ziel=INVENTUR_ARTIKEL_BY_ID[id];if(ziel)m[normName(name)]=ziel;
  });
  return m;
})();
// Reichert einen BÄKO-/HW-Artikel mit den Zusatzinfos an, die für die 11 "festgelegten" Artikel
// (Kassen-/Rezeptabgleich) hinterlegt sind — Zuordnung über den (normalisierten) Namen.
function inventurAnreichern(basis){
  const info=INVENTUR_ARTIKEL_BY_NORM[normName(basis.name)]||null;
  return{
    ...basis,
    anzeigeName:info?.anzeigeName||null,
    einheit:info?.einheit||basis.einheit||'St.',
    verp:info?.verp||basis.verp||'',
    zaehleinheit:info?.zaehleinheit||null,
    kategorie:basis.kategorie||info?.kategorie||'Sonstiges',
    festgelegt:!!info?.festgelegt,
    softdrink:!!info?.softdrink,
    posNrs:info?.posNrs||null,
    rezept:info?.rezept,
    verkaufBasiert:!!info?.verkaufBasiert,
    bakoEinheitFaktor:info?.bakoEinheitFaktor,
  };
}
function inventurKatalogFuerFiliale(fil){
  const bako=(BAEKO[fil]||[]).map(a=>inventurAnreichern({id:'bk_'+a.id,sourceId:a.id,quelle:'baeko',name:a.name,kategorie:a.kat}));
  const hw=(METRO[fil]||[]).map(a=>inventurAnreichern({id:a.id,sourceId:a.id,quelle:'hw',name:a.name,kategorie:a.kat}));
  return[...bako,...hw].filter(a=>!INVENTUR_AUSSCHLUSS.has(normName(a.name)));
}
function invZugang(filiale,monatKey,artikel){
  const[j,m]=monatKey.split('-').map(Number);
  let summe=0;
  const typ=artikel.quelle==='hw'?'metro':'baeko';
  db.bestellungen.forEach(o=>{
    if(o.typ!==typ||o.filiale!==filiale)return;
    const d=new Date(o.datum);
    if(d.getFullYear()!==j||d.getMonth()+1!==m)return;
    if(o.status==='offen')return; // nur tatsächlich versendete Mengen zählen
    (o.positionen||[]).forEach(p=>{
      if(p.id===artikel.sourceId)summe+=p.menge||0;
    });
  });
  return summe;
}
function invVerkauf(artikel,filiale,monatKey){
  const vz=(db.verkaufszahlen[filiale]||{})[monatKey]||{};
  if(artikel.rezept){
    let g=0;
    Object.entries(KAFFEE_REZEPTE).forEach(([posNr,r])=>{
      const anzahl=vz[posNr]||0;
      g+=anzahl*(artikel.rezept==='kaffee'?r.kaffee:r.milch);
    });
    return g/1000; // Gramm → kg bzw. l
  }
  if(artikel.posNrs){
    return artikel.posNrs.reduce((s,pn)=>s+(vz[pn]||0),0);
  }
  return 0;
}
// Vorerst deaktiviert (zu viel auf einmal): Soll wird nur aus Anfang+Zugang berechnet,
// der Kassen-/Rezeptabgleich (Verkauf) bleibt vorbereitet, wird aber nicht abgezogen.
// Einfach auf true stellen, sobald das Gegenrechnen der Abverkäufe wieder gewünscht ist.
const INVENTUR_VERKAUFSABGLEICH_AKTIV=false;
// Die alten Juli-Excel-Zahlen werden NICHT mehr als Anfangsbestand-Rückfalloption verwendet
// (auf Wunsch verworfen) — der Anfangsbestand kommt ab jetzt ausschließlich aus echten,
// in der App erfassten Daten (Bestellungen, Inventuren, Verkaufszahlen). Erste Zählung ohne
// vorherige digitale Inventur startet damit bewusst bei Anfang 0.
const INVENTUR_JULI_STARTWERTE_AKTIV=false;
function invSollListe(filiale,monatKey,anfangOverride){
  const anfang=anfangOverride||(db.inventurAnfang[filiale]||{});
  const startDefaultsRoh=INVENTUR_JULI_STARTWERTE_AKTIV?(STARTBESTAND_JULI[filiale]||{}):{};
  const startDefaults={};
  Object.entries(startDefaultsRoh).forEach(([id,v])=>{startDefaults[normName(INVENTUR_ARTIKEL_BY_ID[id]?.name||id)]=v;});
  return inventurKatalogFuerFiliale(filiale).map(a=>{
    const zugangRoh=invZugang(filiale,monatKey,a);
    const zugang=zugangRoh*(a.bakoEinheitFaktor||1);
    const verkauf=(INVENTUR_VERKAUFSABGLEICH_AKTIV&&a.verkaufBasiert)?invVerkauf(a,filiale,monatKey):0;
    const start=anfang[a.id]!==undefined?anfang[a.id]:(startDefaults[normName(a.name)]||0);
    const soll=Math.max(0,start+zugang-verkauf);
    return{...a,anfang:start,zugang,verkauf,soll:Math.round(soll*100)/100};
  });
}
function invAuffaellig(soll,ist){
  const diff=ist-soll;
  const absDiff=Math.abs(diff);
  const minMenge=soll<10?0.5:3; // grob: kg/l-Artikel haben meist kleinere Sollmengen
  const proz=soll>0?absDiff/soll:(absDiff>0?1:0);
  return absDiff>=minMenge&&proz>=0.10;
}
function invArtikelInfo(p){
  return(p.id&&INVENTUR_ARTIKEL_BY_ID[p.id])
    ||INVENTUR_ARTIKEL_BY_NAME[p.name]
    ||(INVENTUR_NAMENS_ALIAS[p.name]&&INVENTUR_ARTIKEL_BY_ID[INVENTUR_NAMENS_ALIAS[p.name]])
    ||null;
}
const INVENTUR_KATEGORIE_REIHENFOLGE=['TEE','KAFFEE U.MILCH','VERPACKUNG','REINIGUNGSMITTEL','GETRÄNKE','HANDELSWAREN','TÜTEN UND KASSENROLLE'];

function renderInventur(){
  if(U==='Verwaltung'){renderInventurAuswertung();return;}
  if(INVENTUR_JULI_STARTWERTE_AKTIV&&STARTBESTAND_JULI[U])stelleAnfangsbestandSicher(U);

  const kategorien=INVENTUR_KATEGORIE_REIHENFOLGE.filter(k=>liste.some(a=>a.kategorie===k))
    .concat([...new Set(liste.map(a=>a.kategorie))].filter(k=>!INVENTUR_KATEGORIE_REIHENFOLGE.includes(k)));
  mc.innerHTML=`<div class="card">
    <div class="ctitle">🔍 Inventur ${monatLabel(monatKey)}</div>
    <p style="font-size:12px;color:var(--light);margin-bottom:14px">Bitte alle Artikel zählen und die tatsächliche Menge eintragen.</p>
    ${kategorien.map(kat=>`
      <div class="slbl" style="margin-top:14px">${kat}</div>
      ${liste.filter(a=>a.kategorie===kat).map(a=>`
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:14px">${a.anzeigeName||a.name}${(a.verp||a.zaehleinheit)?` <span style="font-size:11px;color:var(--light)">(${[a.verp,a.zaehleinheit].filter(Boolean).join(' · ')})</span>`:''}</span>
          <input type="number" step="0.01" min="0" id="inv-${a.id}" placeholder="${a.einheit}" style="width:90px;text-align:center">
        </div>`).join('')}
    `).join('')}
    <hr class="div">
    <div class="slbl">Ihr Name</div>
    <input type="text" id="inv-name" placeholder="Wer zählt gerade?" style="width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:14px;margin-bottom:10px">
    <div class="brow">
      <button class="btn btn-p" onclick="submitInventur('${monatKey}')">✅ Inventur abschließen</button>
    </div>
  </div>`;
}
function submitInventur(monatKey){
  const name=document.getElementById('inv-name')?.value.trim();
  if(!name){toast('Bitte Namen eintragen.');return;}
  const sollListe=invSollListe(U,monatKey);
  const positionen=[];
  const naechsterAnfang={};
  for(const a of sollListe){
    const el=document.getElementById('inv-'+a.id);
    const ist=parseFloat(el?.value);
    if(el&&isNaN(ist)){toast(`Bitte Menge für "${a.name}" eintragen.`);return;}
    positionen.push({id:a.id,name:a.anzeigeName||a.name,kategorie:a.kategorie,festgelegt:a.festgelegt,softdrink:a.softdrink,anfang:a.anfang,zugang:a.zugang,verkauf:a.verkauf,soll:a.soll,ist:ist||0,diff:Math.round(((ist||0)-a.soll)*100)/100,unit:a.einheit});
    naechsterAnfang[a.id]=ist||0;
  }
  db.inventuren.push({
    id:'inv_'+Date.now(),filiale:U,monat:monatKey,person:name,datum:new Date().toISOString(),positionen
  });
  // Gezählter Ist-Bestand wird automatisch zum Anfangsbestand des Folgemonats
  if(!db.inventurAnfang)db.inventurAnfang={};
  db.inventurAnfang[U]=naechsterAnfang;
  save();
  toast('✅ Inventur gespeichert!');
  renderInventur();
}

function stelleAnfangsbestandSicher(filiale){
  const default_=STARTBESTAND_JULI[filiale];
  if(!default_)return;
  if(!db.inventurAnfang)db.inventurAnfang={};
  const vorhanden=db.inventurAnfang[filiale]||{};
  // additiv: bereits vorhandene Werte (z.B. aus dem monatlichen Rollover) nicht überschreiben,
  // nur fehlende Artikel (z.B. neu hinzugekommene) mit dem Juli-Ist als Startwert ergänzen.
  let neu=false;
  Object.entries(default_).forEach(([k,v])=>{
    if(vorhanden[k]===undefined){vorhanden[k]=v;neu=true;}
  });
  if(neu){db.inventurAnfang[filiale]=vorhanden;save();}
  if(filiale==='B5'&&JULI_VERKAUF_B5){
    if(!db.verkaufszahlen)db.verkaufszahlen={};
    if(!db.verkaufszahlen.B5)db.verkaufszahlen.B5={};
    if(!db.verkaufszahlen.B5['2026-07']){db.verkaufszahlen.B5['2026-07']=JULI_VERKAUF_B5;save();}
  }
}
function renderInventurAuswertungBody(monatKey,filiale){
  filiale=filiale||document.getElementById('inv-fil-sel')?.value||'B1';
  const body=document.getElementById('inv-ausw-body');if(!body)return;
  const inv=db.inventuren.find(i=>i.filiale===filiale&&i.monat===monatKey);
  if(!inv){body.innerHTML=`<p style="font-size:13px;color:var(--light)">Für ${filiale} liegt für diesen Monat noch keine Inventur vor.</p>`;return;}
  const angereichert=inv.positionen.map(p=>{
    const info=invArtikelInfo(p);
    return{...p,kategorie:p.kategorie||info?.kategorie||'Sonstiges',
      festgelegt:p.festgelegt!==undefined?p.festgelegt:!!info?.festgelegt,
      softdrink:p.softdrink!==undefined?p.softdrink:!!info?.softdrink};
  }).filter(p=>p.kategorie==='GETRÄNKE'||p.kategorie==='KAFFEE U.MILCH'||p.kategorie==='TEE'); // Verwaltung wertet nur Soft-/Heißgetränke aus; Verpackung/Reinigung/Handelsware/Tüten werden nur gezählt, nicht ausgewertet
  const auffaelligAnzahl=angereichert.filter(p=>invAuffaellig(p.soll,p.ist)).length;
  const kategorien=INVENTUR_KATEGORIE_REIHENFOLGE.filter(k=>angereichert.some(p=>p.kategorie===k))
    .concat([...new Set(angereichert.map(p=>p.kategorie))].filter(k=>!INVENTUR_KATEGORIE_REIHENFOLGE.includes(k)));
  const row=p=>{
    const rot=invAuffaellig(p.soll,p.ist);
    const proz=p.soll>0?Math.round((p.diff/p.soll)*1000)/10:null;
    const abwWert=!p.festgelegt?'':
      `<span style="font-size:16px;font-weight:600;${rot?'color:var(--red)':'color:var(--mid)'}">${p.diff>=0?'+':''}${p.diff}</span>`+
      (p.softdrink?`<span style="font-size:12px;margin-left:6px;${rot?'color:var(--red)':'color:var(--light)'}">(${proz===null?'–':(proz>=0?'+':'')+proz+'%'})</span>`:'');
    const hatAufschluesselung=p.anfang!==undefined&&p.zugang!==undefined;
    const rechenweg=hatAufschluesselung
      ? `Anfang ${p.anfang} + Zugang ${p.zugang}${p.verkauf?` − Verkauf ${p.verkauf}`:''} = Soll ${p.soll} ${p.unit} · Ist ${p.ist} ${p.unit}`
      : `Soll ${p.soll} ${p.unit} · Ist ${p.ist} ${p.unit}`;
    return`<div style="background:${rot?'var(--red-lt)':'var(--surface,#f7f7f5)'};border-radius:var(--rsm);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;${rot?'':'border:1px solid var(--border)'}">
      <div><div style="font-size:14px;${rot?'color:var(--red)':''}">${p.name}</div>
        <div style="font-size:11px;${rot?'color:var(--red)':'color:var(--light)'}">${rechenweg}</div></div>
      <div style="text-align:right;min-width:70px;flex-shrink:0">${abwWert}</div>
    </div>`;
  };
  body.innerHTML=`
    <p style="font-size:12px;color:var(--light);margin-bottom:12px">${filiale} · abgeschlossen ${new Date(inv.datum).toLocaleDateString('de-DE')} von ${inv.person}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div style="background:var(--cream);border-radius:var(--rsm);padding:12px"><div style="font-size:12px;color:var(--light)">Artikel gezählt</div><div style="font-size:20px;font-weight:600">${inv.positionen.length}</div><div style="font-size:10px;color:var(--light)">davon ${angereichert.length} ausgewertet (Soft-/Heißgetränke)</div></div>
      <div style="background:${auffaelligAnzahl?'var(--red-lt)':'var(--cream)'};border-radius:var(--rsm);padding:12px"><div style="font-size:12px;${auffaelligAnzahl?'color:var(--red)':'color:var(--light)'}">Auffällige Diff.</div><div style="font-size:20px;font-weight:600;${auffaelligAnzahl?'color:var(--red)':''}">${auffaelligAnzahl}</div></div>
    </div>
    ${kategorien.map(kat=>`
      <div class="slbl" style="margin-top:14px">${kat}</div>
      ${angereichert.filter(p=>p.kategorie===kat).map(row).join('')}
    `).join('')}
    <div class="brow no-print" style="margin-top:10px"><button class="btn btn-o btn-sm" onclick="printInv('${inv.id}')">🖨️ PDF</button></div>
  `;
}

function _printHTML(html,auto){
  if(auto){
    const fr=document.createElement('iframe');
    fr.style.cssText='position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;border:none';
    fr.onload=()=>{
      try{
        fr.contentWindow.focus();
        fr.contentWindow.print();
      }catch(e){console.warn('iframe print error:',e);}
      setTimeout(()=>{if(fr.parentNode)fr.parentNode.removeChild(fr);},3000);
    };
    document.body.appendChild(fr);
    // Leere zweite Seite verhindern
    const htmlNoBlanks=html.replace('</body>','<style>html,body{height:auto!important;overflow:hidden!important;}</style></body>');
    fr.srcdoc=htmlNoBlanks;
  }else{
    const w=window.open('','_blank');
    if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),300);}
  }
}

        <div class="val">${lieferFmt}</div>
      </div>
      ${s.tour?`<div class="rahmen-field"><label>Tour</label><div class="val">${s.tour}</div></div>`:''}
    </div>
    <div class="bestellung-label">Bestellung</div>
    ${s.text?`<div class="bestellung-text">${s.text}</div>`:''}
    ${s.artikel&&s.artikel.length?`<table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:12px"><tr><th style="text-align:left;border-bottom:1px solid #ccc;padding:4px 0">Artikel</th><th style="text-align:right;border-bottom:1px solid #ccc;padding:4px 0">Menge</th></tr>${s.artikel.map(a=>`<tr><td style="padding:3px 0">${a.name}</td><td style="text-align:right;padding:3px 0">${a.menge}</td></tr>`).join('')}</table>`:''}
  </div>
  </body></html>`,auto);
}
function printReinigung(id,auto){
  const r=(db.reinigung||[]).find(x=>x.id===id);if(!r)return;
  _printHTML(`<html><head><title>Reinigung ${fname(r.filiale)}</title>
  <style>body{font-family:sans-serif;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}th{background:#f0f0f0}</style></head><body>
  <h2>🧴 Reinigungsbestellung – ${fname(r.filiale)}</h2>
  <p style="color:#888;font-size:13px">${new Date(r.datum).toLocaleString('de-DE')}</p>
  <table><tr><th>Artikel</th><th>Menge</th></tr>
  ${r.positionen.map(p=>`<tr><td>${p.name}</td><td>${p.menge}</td></tr>`).join('')}
  </table>${r.kommentar?`<p><strong>Kommentar:</strong> ${r.kommentar}</p>`:''}</body></html>`,auto);
}
</script>
</body>
